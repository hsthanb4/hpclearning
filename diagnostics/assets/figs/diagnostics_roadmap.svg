<?xml version="1.0" encoding="UTF-8"?>
<svg width="1100" height="635" viewBox="0 0 1100 635" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .font-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Inter", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; font-weight: 800; }
      .font-bold { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Inter", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; font-weight: 700; }
      .font-medium { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Inter", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; font-weight: 600; }
      .font-regular { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Inter", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; font-weight: 500; }
      .font-mono { font-family: "JetBrains Mono", Menlo, Monaco, Consolas, monospace; font-weight: 700; }
    </style>
    <filter id="shadow-card" x="-2%" y="-4%" width="104%" height="110%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2.5" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>

  <!-- Background Frame -->
  <rect x="0" y="0" width="1100" height="635" rx="18" fill="#FAF9F5" stroke="#E5DFD5" stroke-width="1.5"/>

  <!-- Top Title Bar -->
  <text x="45" y="46" fill="#0F172A" class="font-title" font-size="20" letter-spacing="-0.02em">性能剖析、死锁诊断与状态审计学习路线全景</text>
  <text x="45" y="68" fill="#64748B" class="font-regular" font-size="12.5">从系统级 Timeline 逐帧归因、微架构算子调优到分布式通信死锁排障与不变量守卫</text>

  
  <!-- Lesson 01 -->
  <g filter="url(#shadow-card)">
    <rect x="45" y="92" width="1010" height="88" rx="12" fill="#FFFFFF" stroke="#E5DFD5" stroke-width="1.2"/>
  </g>
  <rect x="68" y="107" width="36" height="22" rx="5" fill="#FBF5F2" stroke="#CC6644" stroke-width="1"/>
  <text x="86" y="122" fill="#CC6644" class="font-mono" font-size="11.5" text-anchor="middle">01</text>
  <text x="116" y="123" fill="#0F172A" class="font-bold" font-size="14.5">第 1 课：Nsight Systems 全链路 Timeline</text>

  <rect x="820" y="107" width="210" height="22" rx="5" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="925" y="122" fill="#64748B" class="font-mono" font-size="10" text-anchor="middle">HOST-DEVICE 同步气泡</text>

  <text x="68" y="152" fill="#475569" class="font-regular" font-size="12">
    分析系统级 Trace，定位 CPU 调度延迟、Kernel 发射间隙与隐式同步屏障导致的 GPU 空转。
  </text>

  <line x1="550" y1="182" x2="550" y2="194" stroke="#CC6644" stroke-width="2.2" stroke-dasharray="3 3"/>
  <polygon points="546,194 554,194 550,199" fill="#CC6644"/>

  <!-- Lesson 02 -->
  <g filter="url(#shadow-card)">
    <rect x="45" y="198" width="1010" height="88" rx="12" fill="#FFFFFF" stroke="#E5DFD5" stroke-width="1.2"/>
  </g>
  <rect x="68" y="213" width="36" height="22" rx="5" fill="#FBF5F2" stroke="#CC6644" stroke-width="1"/>
  <text x="86" y="228" fill="#CC6644" class="font-mono" font-size="11.5" text-anchor="middle">02</text>
  <text x="116" y="229" fill="#0F172A" class="font-bold" font-size="14.5">第 2 课：Nsight Compute 算子微架构瓶颈</text>

  <rect x="820" y="213" width="210" height="22" rx="5" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="925" y="228" fill="#64748B" class="font-mono" font-size="10" text-anchor="middle">ROOFLINE &amp; WARP STALLS</text>

  <text x="68" y="258" fill="#475569" class="font-regular" font-size="12">
    掌握 SOL 指标与 Roofline 模型，归因 Long Scoreboard、MIO Throttle 与 Bank Conflicts 停顿。
  </text>

  <line x1="550" y1="288" x2="550" y2="300" stroke="#CC6644" stroke-width="2.2" stroke-dasharray="3 3"/>
  <polygon points="546,300 554,300 550,305" fill="#CC6644"/>

  <!-- Lesson 03 -->
  <g filter="url(#shadow-card)">
    <rect x="45" y="304" width="1010" height="88" rx="12" fill="#FFFFFF" stroke="#E5DFD5" stroke-width="1.2"/>
  </g>
  <rect x="68" y="319" width="36" height="22" rx="5" fill="#FBF5F2" stroke="#CC6644" stroke-width="1"/>
  <text x="86" y="334" fill="#CC6644" class="font-mono" font-size="11.5" text-anchor="middle">03</text>
  <text x="116" y="335" fill="#0F172A" class="font-bold" font-size="14.5">第 3 课：分布式通信死锁逆向定位</text>

  <rect x="820" y="319" width="210" height="22" rx="5" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="925" y="334" fill="#64748B" class="font-mono" font-size="10" text-anchor="middle">NCCL DEADLOCK &amp; GDB</text>

  <text x="68" y="364" fill="#475569" class="font-regular" font-size="12">
    深入 NCCL 环形通信挂起、跨节点 P2P 循环等待死锁，利用 GDB/Py-Spy 联合栈追踪还原现场。
  </text>

  <line x1="550" y1="394" x2="550" y2="406" stroke="#CC6644" stroke-width="2.2" stroke-dasharray="3 3"/>
  <polygon points="546,406 554,406 550,411" fill="#CC6644"/>

  <!-- Lesson 04 -->
  <g filter="url(#shadow-card)">
    <rect x="45" y="410" width="1010" height="88" rx="12" fill="#FFFFFF" stroke="#E5DFD5" stroke-width="1.2"/>
  </g>
  <rect x="68" y="425" width="36" height="22" rx="5" fill="#FBF5F2" stroke="#CC6644" stroke-width="1"/>
  <text x="86" y="440" fill="#CC6644" class="font-mono" font-size="11.5" text-anchor="middle">04</text>
  <text x="116" y="441" fill="#0F172A" class="font-bold" font-size="14.5">第 4 课：FP8/BF16 浮点精度异常与下溢</text>

  <rect x="820" y="425" width="210" height="22" rx="5" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="925" y="440" fill="#64748B" class="font-mono" font-size="10" text-anchor="middle">NUMERICAL CRASH &amp; NAN</text>

  <text x="68" y="470" fill="#475569" class="font-regular" font-size="12">
    推导低精度窄位宽截断规律，设计片上 NaN/Inf 级联探测器，排查梯度下溢更新吞噬故障。
  </text>

  <line x1="550" y1="500" x2="550" y2="512" stroke="#CC6644" stroke-width="2.2" stroke-dasharray="3 3"/>
  <polygon points="546,512 554,512 550,517" fill="#CC6644"/>

  <!-- Lesson 05 -->
  <g filter="url(#shadow-card)">
    <rect x="45" y="516" width="1010" height="88" rx="12" fill="#FFFFFF" stroke="#E5DFD5" stroke-width="1.2"/>
  </g>
  <rect x="68" y="531" width="36" height="22" rx="5" fill="#FBF5F2" stroke="#CC6644" stroke-width="1"/>
  <text x="86" y="546" fill="#CC6644" class="font-mono" font-size="11.5" text-anchor="middle">05</text>
  <text x="116" y="547" fill="#0F172A" class="font-bold" font-size="14.5">第 5 课：Code Agent 时代底层不变量审计</text>

  <rect x="820" y="531" width="210" height="22" rx="5" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="925" y="546" fill="#64748B" class="font-mono" font-size="10" text-anchor="middle">INVARIANT AUDIT &amp; RECOVERY</text>

  <text x="68" y="576" fill="#475569" class="font-regular" font-size="12">
    构建系统级守卫断言，自动化巡检 IPC 显存泄漏、异步流悬空、4KB 硬件未对齐等深层暗病。
  </text>

</svg>