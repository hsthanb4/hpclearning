<?xml version="1.0" encoding="UTF-8"?>
<svg width="1100" height="500" viewBox="0 0 1100 500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .font-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Inter", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; font-weight: 800; }
      .font-bold { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Inter", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; font-weight: 700; }
      .font-medium { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Inter", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; font-weight: 600; }
      .font-regular { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Inter", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; font-weight: 500; }
      .font-mono { font-family: "JetBrains Mono", Menlo, Monaco, Consolas, monospace; font-weight: 700; }
    </style>
    <filter id="shadow-card" x="-2%" y="-4%" width="104%" height="110%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2.5" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>

  <!-- Background Frame -->
  <rect x="0" y="0" width="1100" height="500" rx="18" fill="#FAF9F5" stroke="#E5DFD5" stroke-width="1.5"/>

  <!-- Top Title Bar -->
  <text x="45" y="46" fill="#0F172A" class="font-title" font-size="20" letter-spacing="-0.02em">具身多模态异构双 Mesh 并行拓扑与跨网格张量重构体系</text>
  <text x="45" y="68" fill="#64748B" class="font-regular" font-size="12.5">解耦视觉网格（ViT: DP=8, TP=1）与语言动作网格（LLM: DP=2, TP=4），彻底打破 MFU 算力雪崩</text>

  
  <!-- Top: Vision Mesh -->
  <g filter="url(#shadow-card)">
    <rect x="45" y="92" width="1010" height="110" rx="14" fill="#FFFFFF" stroke="#E5DFD5" stroke-width="1.2"/>
  </g>
  <rect x="68" y="108" width="130" height="22" rx="11" fill="#F0FDF4" stroke="#16A34A" stroke-width="0.8"/>
  <text x="133" y="123" fill="#16A34A" class="font-mono" font-size="10.5" text-anchor="middle">VISION MESH</text>
  <text x="210" y="124" fill="#0F172A" class="font-bold" font-size="14">视觉编码器设备网格 (DP_V = 8, TP_V = 1: 参数小、图像分辨率极高、无跨卡通信)</text>

  <g transform="translate(68, 142)">

    <rect x="0" y="0" width="112" height="44" rx="8" fill="#F8FAFC" stroke="#86EFAC" stroke-width="1"/>
    <text x="56" y="20" fill="#0F172A" class="font-bold" font-size="11.5" text-anchor="middle">GPU 0</text>
    <text x="56" y="35" fill="#64748B" class="font-regular" font-size="10" text-anchor="middle">处理全图 Patch 0</text>

    <rect x="122" y="0" width="112" height="44" rx="8" fill="#F8FAFC" stroke="#86EFAC" stroke-width="1"/>
    <text x="178" y="20" fill="#0F172A" class="font-bold" font-size="11.5" text-anchor="middle">GPU 1</text>
    <text x="178" y="35" fill="#64748B" class="font-regular" font-size="10" text-anchor="middle">处理全图 Patch 1</text>

    <rect x="244" y="0" width="112" height="44" rx="8" fill="#F8FAFC" stroke="#86EFAC" stroke-width="1"/>
    <text x="300" y="20" fill="#0F172A" class="font-bold" font-size="11.5" text-anchor="middle">GPU 2</text>
    <text x="300" y="35" fill="#64748B" class="font-regular" font-size="10" text-anchor="middle">处理全图 Patch 2</text>

    <rect x="366" y="0" width="112" height="44" rx="8" fill="#F8FAFC" stroke="#86EFAC" stroke-width="1"/>
    <text x="422" y="20" fill="#0F172A" class="font-bold" font-size="11.5" text-anchor="middle">GPU 3</text>
    <text x="422" y="35" fill="#64748B" class="font-regular" font-size="10" text-anchor="middle">处理全图 Patch 3</text>

    <rect x="488" y="0" width="112" height="44" rx="8" fill="#F8FAFC" stroke="#86EFAC" stroke-width="1"/>
    <text x="544" y="20" fill="#0F172A" class="font-bold" font-size="11.5" text-anchor="middle">GPU 4</text>
    <text x="544" y="35" fill="#64748B" class="font-regular" font-size="10" text-anchor="middle">处理全图 Patch 4</text>

    <rect x="610" y="0" width="112" height="44" rx="8" fill="#F8FAFC" stroke="#86EFAC" stroke-width="1"/>
    <text x="666" y="20" fill="#0F172A" class="font-bold" font-size="11.5" text-anchor="middle">GPU 5</text>
    <text x="666" y="35" fill="#64748B" class="font-regular" font-size="10" text-anchor="middle">处理全图 Patch 5</text>

    <rect x="732" y="0" width="112" height="44" rx="8" fill="#F8FAFC" stroke="#86EFAC" stroke-width="1"/>
    <text x="788" y="20" fill="#0F172A" class="font-bold" font-size="11.5" text-anchor="middle">GPU 6</text>
    <text x="788" y="35" fill="#64748B" class="font-regular" font-size="10" text-anchor="middle">处理全图 Patch 6</text>

    <rect x="854" y="0" width="112" height="44" rx="8" fill="#F8FAFC" stroke="#86EFAC" stroke-width="1"/>
    <text x="910" y="20" fill="#0F172A" class="font-bold" font-size="11.5" text-anchor="middle">GPU 7</text>
    <text x="910" y="35" fill="#64748B" class="font-regular" font-size="10" text-anchor="middle">处理全图 Patch 7</text>
  </g>

  <!-- Middle: Cross-Mesh Resharding Bus -->
  <g transform="translate(45, 218)">
    <rect x="0" y="0" width="1010" height="54" rx="10" fill="#FBF5F2" stroke="#CC6644" stroke-width="1.2"/>
    <text x="505" y="24" fill="#8C4325" class="font-bold" font-size="13.5" text-anchor="middle">跨网格动态重排通信层 (Cross-Mesh All-to-All Resharding)</text>
    <text x="505" y="42" fill="#CC6644" class="font-regular" font-size="11" text-anchor="middle">视觉网格输出特征 [B_v, S_v, D_v] ➔ 沿特征通道切片 + 沿微批次维度重组分发 ➔ 语言网格 [B_l, S_v, D_l / TP_L]</text>
  </g>

  <!-- Arrows from Vision to Reshard, Reshard to Language -->
  <g stroke="#CC6644" stroke-width="2" stroke-dasharray="3 3">
    <line x1="550" y1="202" x2="550" y2="218"/>
    <line x1="550" y1="272" x2="550" y2="288"/>
  </g>

  <!-- Bottom: Language-Action Mesh -->
  <g filter="url(#shadow-card)" transform="translate(45, 288)">
    <rect x="0" y="0" width="1010" height="160" rx="14" fill="#FFFFFF" stroke="#E5DFD5" stroke-width="1.2"/>
  </g>
  <rect x="68" y="304" width="150" height="22" rx="11" fill="#EFF6FF" stroke="#2563EB" stroke-width="0.8"/>
  <text x="143" y="319" fill="#2563EB" class="font-mono" font-size="10.5" text-anchor="middle">LANGUAGE-ACTION MESH</text>
  <text x="230" y="320" fill="#0F172A" class="font-bold" font-size="14">语言-动作骨干网网格 (DP_L = 2, TP_L = 4: 参数巨大 7B~70B，张量并行切分)</text>

  <!-- Two DP Groups -->
  <g transform="translate(68, 338)">
    <!-- DP Group 0 -->
    <rect x="0" y="0" width="460" height="92" rx="9" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
    <text x="16" y="24" fill="#0F172A" class="font-bold" font-size="12">DP 组 0 (负责微批次 Batch 0, 1)</text>
    <g transform="translate(16, 36)">
      <rect x="0" y="0" width="98" height="42" rx="6" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="0.8"/>
      <text x="49" y="19" fill="#1E40AF" class="font-mono" font-size="11" text-anchor="middle">GPU 0 (TP 0)</text>
      <text x="49" y="33" fill="#64748B" class="font-regular" font-size="9.5" text-anchor="middle">通道分片 0</text>

      <rect x="110" y="0" width="98" height="42" rx="6" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="0.8"/>
      <text x="159" y="19" fill="#1E40AF" class="font-mono" font-size="11" text-anchor="middle">GPU 1 (TP 1)</text>
      <text x="159" y="33" fill="#64748B" class="font-regular" font-size="9.5" text-anchor="middle">通道分片 1</text>

      <rect x="220" y="0" width="98" height="42" rx="6" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="0.8"/>
      <text x="269" y="19" fill="#1E40AF" class="font-mono" font-size="11" text-anchor="middle">GPU 2 (TP 2)</text>
      <text x="269" y="33" fill="#64748B" class="font-regular" font-size="9.5" text-anchor="middle">通道分片 2</text>

      <rect x="330" y="0" width="98" height="42" rx="6" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="0.8"/>
      <text x="379" y="19" fill="#1E40AF" class="font-mono" font-size="11" text-anchor="middle">GPU 3 (TP 3)</text>
      <text x="379" y="33" fill="#64748B" class="font-regular" font-size="9.5" text-anchor="middle">通道分片 3</text>
    </g>

    <!-- DP Group 1 -->
    <rect x="496" y="0" width="460" height="92" rx="9" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
    <text x="512" y="24" fill="#0F172A" class="font-bold" font-size="12">DP 组 1 (负责微批次 Batch 2, 3)</text>
    <g transform="translate(512, 36)">
      <rect x="0" y="0" width="98" height="42" rx="6" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="0.8"/>
      <text x="49" y="19" fill="#1E40AF" class="font-mono" font-size="11" text-anchor="middle">GPU 4 (TP 0)</text>
      <text x="49" y="33" fill="#64748B" class="font-regular" font-size="9.5" text-anchor="middle">通道分片 0</text>

      <rect x="110" y="0" width="98" height="42" rx="6" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="0.8"/>
      <text x="159" y="19" fill="#1E40AF" class="font-mono" font-size="11" text-anchor="middle">GPU 5 (TP 1)</text>
      <text x="159" y="33" fill="#64748B" class="font-regular" font-size="9.5" text-anchor="middle">通道分片 1</text>

      <rect x="220" y="0" width="98" height="42" rx="6" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="0.8"/>
      <text x="269" y="19" fill="#1E40AF" class="font-mono" font-size="11" text-anchor="middle">GPU 6 (TP 2)</text>
      <text x="269" y="33" fill="#64748B" class="font-regular" font-size="9.5" text-anchor="middle">通道分片 2</text>

      <rect x="330" y="0" width="98" height="42" rx="6" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="0.8"/>
      <text x="379" y="19" fill="#1E40AF" class="font-mono" font-size="11" text-anchor="middle">GPU 7 (TP 3)</text>
      <text x="379" y="33" fill="#64748B" class="font-regular" font-size="9.5" text-anchor="middle">通道分片 3</text>
    </g>
  </g>

</svg>