  <text x="933" y="368" fill="#475569" class="font-regular" font-size="10.5" text-anchor="middle">通信代价：前向与反向二次拼合，</text>
  <text x="933" y="386" fill="#475569" class="font-regular" font-size="10.5" text-anchor="middle">总通信量扩大为 3Ψ。</text>
  
