  <text x="45" y="46" fill="#0F172A" class="font-title" font-size="20" letter-spacing="-0.02em">ZeRO-1/2/3 显存状态逐级分片消除机制演进拓扑</text>
  <text x="45" y="68" fill="#64748B" class="font-regular" font-size="12.5">从传统 DDP 全量冗余到 FSDP 参数即用即弃，通信量、显存上限与切分维度的数学解析</text>

  
  <!-- Stage 0 Card -->
  <g filter="url(#shadow-card)">
