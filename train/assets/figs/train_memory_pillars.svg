<?xml version="1.0" encoding="UTF-8"?>
<svg width="1100" height="480" viewBox="0 0 1100 480" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .font-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Inter", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; font-weight: 800; }
      .font-bold { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Inter", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; font-weight: 700; }
      .font-medium { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Inter", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; font-weight: 600; }
      .font-regular { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Inter", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; font-weight: 500; }
      .font-mono { font-family: "JetBrains Mono", Menlo, Monaco, Consolas, monospace; font-weight: 700; }
    </style>
    <filter id="shadow-card" x="-2%" y="-4%" width="104%" height="110%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2.5" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>

  <!-- Background Frame -->
  <rect x="0" y="0" width="1100" height="480" rx="18" fill="#FAF9F5" stroke="#E5DFD5" stroke-width="1.5"/>

  <!-- Top Title Bar -->
  <text x="45" y="46" fill="#0F172A" class="font-title" font-size="20" letter-spacing="-0.02em">大模型训练全生命周期显存账本四分支物理构成</text>
  <text x="45" y="68" fill="#64748B" class="font-regular" font-size="12.5">静态常驻显存（参数、梯度、优化器状态）与动态弹性显存（激活值、工作区、内存碎片）全景剖析</text>

  
  <!-- Left Vault: Static Memory (16N ~ 20N) -->
  <g filter="url(#shadow-card)">
    <rect x="45" y="92" width="485" height="340" rx="14" fill="#FFFFFF" stroke="#E5DFD5" stroke-width="1.2"/>
  </g>
  <rect x="65" y="110" width="130" height="24" rx="12" fill="#FBF5F2" stroke="#CC6644" stroke-width="1"/>
  <text x="130" y="126.5" fill="#CC6644" class="font-mono" font-size="11" text-anchor="middle">STATIC MEMORY</text>
  <text x="205" y="127" fill="#0F172A" class="font-bold" font-size="15">静态常驻显存（与批次无关，约 16N~20N）</text>

  <!-- Static Items -->
  <g transform="translate(65, 148)">
    <!-- Param -->
    <rect x="0" y="0" width="445" height="66" rx="9" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
    <rect x="14" y="12" width="5" height="42" rx="2" fill="#2563EB"/>
    <text x="30" y="29" fill="#0F172A" class="font-bold" font-size="13">1. 模型参数 (Model Parameters)</text>
    <text x="30" y="50" fill="#64748B" class="font-regular" font-size="11.5">BF16 / FP16 精度占用 <tspan fill="#2563EB" class="font-mono">2N bytes</tspan>；用于前向与反向高效矩阵乘计算。</text>

    <!-- Grad -->
    <rect x="0" y="78" width="445" height="66" rx="9" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
    <rect x="14" y="90" width="5" height="42" rx="2" fill="#10B981"/>
    <text x="30" y="107" fill="#0F172A" class="font-bold" font-size="13">2. 模型梯度 (Gradients)</text>
    <text x="30" y="128" fill="#64748B" class="font-regular" font-size="11.5">BF16 / FP16 精度占用 <tspan fill="#10B981" class="font-mono">2N bytes</tspan>；用于反向链式求导累加与跨卡通信。</text>

    <!-- Optimizer -->
    <rect x="0" y="156" width="445" height="88" rx="9" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
    <rect x="14" y="168" width="5" height="64" rx="2" fill="#EF4444"/>
    <text x="30" y="185" fill="#0F172A" class="font-bold" font-size="13">3. 优化器状态 (AdamW States: 共 12N bytes)</text>
    <text x="30" y="206" fill="#64748B" class="font-regular" font-size="11.5">• FP32 主权重副本 (Master Weights): <tspan fill="#EF4444" class="font-mono">4N bytes</tspan> (防止微小梯度更新被吞噬)</text>
    <text x="30" y="226" fill="#64748B" class="font-regular" font-size="11.5">• FP32 一阶动量 m 与二阶方差 v: <tspan fill="#EF4444" class="font-mono">4N + 4N = 8N bytes</tspan> (保证数值精度)</text>
  </g>

  <!-- Right Vault: Dynamic Memory -->
  <g filter="url(#shadow-card)">
    <rect x="570" y="92" width="485" height="340" rx="14" fill="#FFFFFF" stroke="#E5DFD5" stroke-width="1.2"/>
  </g>
  <rect x="590" y="110" width="145" height="24" rx="12" fill="#EFF6FF" stroke="#2563EB" stroke-width="1"/>
  <text x="662" y="126.5" fill="#2563EB" class="font-mono" font-size="11" text-anchor="middle">DYNAMIC MEMORY</text>
  <text x="745" y="127" fill="#0F172A" class="font-bold" font-size="15">动态弹性显存 (随批次与序列暴涨)</text>

  <!-- Dynamic Items -->
  <g transform="translate(590, 148)">
    <!-- Activations -->
    <rect x="0" y="0" width="445" height="76" rx="9" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
    <rect x="14" y="12" width="5" height="52" rx="2" fill="#F59E0B"/>
    <text x="30" y="29" fill="#0F172A" class="font-bold" font-size="13">4. 动态激活值 (Activations)</text>
    <text x="30" y="49" fill="#64748B" class="font-regular" font-size="11.5">包含线性项 <tspan class="font-mono">34Lsbh</tspan> 与自注意力二次方项 <tspan class="font-mono">5Lba s²</tspan>；</text>
    <text x="30" y="67" fill="#64748B" class="font-regular" font-size="11.5">前向逐层暂存爬升至峰值，反向求导完成后逐层释放。</text>

    <!-- Workspace -->
    <rect x="0" y="88" width="445" height="66" rx="9" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
    <rect x="14" y="100" width="5" height="42" rx="2" fill="#8B5CF6"/>
    <text x="30" y="117" fill="#0F172A" class="font-bold" font-size="13">临时工作空间 (Workspace / Scratchpad)</text>
    <text x="30" y="138" fill="#64748B" class="font-regular" font-size="11.5">cuBLAS/CUTLASS 矩阵乘临时缓冲，NCCL 通信分桶（默认 25MB）。</text>

    <!-- Fragmentation -->
    <rect x="0" y="166" width="445" height="78" rx="9" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
    <rect x="14" y="178" width="5" height="54" rx="2" fill="#EC4899"/>
    <text x="30" y="195" fill="#0F172A" class="font-bold" font-size="13">显存池碎片与运行时底噪 (Fragmentation &amp; Context)</text>
    <text x="30" y="216" fill="#64748B" class="font-regular" font-size="11.5">CUDA Context 常驻约 1~2 GB；Caching Allocator 反复分配/释放</text>
    <text x="30" y="234" fill="#64748B" class="font-regular" font-size="11.5">变长张量，碎片率可达 10%~25%。</text>
  </g>

</svg>