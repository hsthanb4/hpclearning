<?xml version="1.0" encoding="UTF-8"?>
<svg width="1100" height="480" viewBox="0 0 1100 480" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .font-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Inter", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; font-weight: 800; }
      .font-bold { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Inter", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; font-weight: 700; }
      .font-medium { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Inter", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; font-weight: 600; }
      .font-regular { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Inter", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; font-weight: 500; }
      .font-mono { font-family: "JetBrains Mono", Menlo, Monaco, Consolas, monospace; font-weight: 700; }
    </style>
    <filter id="shadow-card" x="-2%" y="-4%" width="104%" height="110%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2.5" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>

  <!-- Background Frame -->
  <rect x="0" y="0" width="1100" height="480" rx="18" fill="#FAF9F5" stroke="#E5DFD5" stroke-width="1.5"/>

  <!-- Top Title Bar -->
  <text x="45" y="46" fill="#0F172A" class="font-title" font-size="20" letter-spacing="-0.02em">工业界大模型并行训练方案选型与切分决策树</text>
  <text x="45" y="68" fill="#64748B" class="font-regular" font-size="12.5">依据参数规模、序列长度、NVLink 机内带宽与跨节点通信开销的标准化决策指南</text>

  
  <!-- Question 1: Sequence Length -->
  <g filter="url(#shadow-card)">
    <rect x="45" y="92" width="280" height="150" rx="14" fill="#FFFFFF" stroke="#E5DFD5" stroke-width="1.2"/>
  </g>
  <rect x="68" y="112" width="115" height="22" rx="11" fill="#FBF5F2" stroke="#CC6644" stroke-width="0.8"/>
  <text x="125" y="126.5" fill="#CC6644" class="font-mono" font-size="10.5" text-anchor="middle">STEP 1 · 序列判定</text>
  <text x="68" y="156" fill="#0F172A" class="font-bold" font-size="15">S &gt; 32k 超长上下文？</text>
  <text x="68" y="180" fill="#64748B" class="font-regular" font-size="11.5">长序列下自注意力激活以 O(s²) 暴涨，</text>
  <text x="68" y="198" fill="#64748B" class="font-regular" font-size="11.5">纯张量并行无法独立化解非 TP 激活。</text>
  <rect x="68" y="210" width="234" height="22" rx="5" fill="#F0FDF4" stroke="#86EFAC" stroke-width="0.8"/>
  <text x="185" y="225" fill="#166534" class="font-bold" font-size="11" text-anchor="middle">是 ➔ 必须引入上下文并行 (CP / Ring)</text>

  <!-- Question 2: Memory Fit on Single GPU -->
  <g filter="url(#shadow-card)">
    <rect x="410" y="92" width="280" height="150" rx="14" fill="#FFFFFF" stroke="#E5DFD5" stroke-width="1.2"/>
  </g>
  <rect x="433" y="112" width="115" height="22" rx="11" fill="#EFF6FF" stroke="#2563EB" stroke-width="0.8"/>
  <text x="490" y="126.5" fill="#2563EB" class="font-mono" font-size="10.5" text-anchor="middle">STEP 2 · 显存判定</text>
  <text x="433" y="156" fill="#0F172A" class="font-bold" font-size="15">单张 80GB 卡能放得下吗？</text>
  <text x="433" y="180" fill="#64748B" class="font-regular" font-size="11.5">核算静态账本 16Φ + 动态微批次激活，</text>
  <text x="433" y="198" fill="#64748B" class="font-regular" font-size="11.5">模型参数量是否处于 7B~13B 以内。</text>
  <rect x="433" y="210" width="234" height="22" rx="5" fill="#F0FDF4" stroke="#86EFAC" stroke-width="0.8"/>
  <text x="550" y="225" fill="#166534" class="font-bold" font-size="11" text-anchor="middle">装得下 ➔ 纯 DP / ZeRO-1 (最高吞吐)</text>

  <!-- Question 3: NVLink Domain Fit -->
  <g filter="url(#shadow-card)">
    <rect x="775" y="92" width="280" height="150" rx="14" fill="#FFFFFF" stroke="#E5DFD5" stroke-width="1.2"/>
  </g>
  <rect x="798" y="112" width="115" height="22" rx="11" fill="#FDF4FF" stroke="#A855F7" stroke-width="0.8"/>
  <text x="855" y="126.5" fill="#A855F7" class="font-mono" font-size="10.5" text-anchor="middle">STEP 3 · 机内判定</text>
  <text x="798" y="156" fill="#0F172A" class="font-bold" font-size="15">机内 NVLink 域放得下吗？</text>
  <text x="798" y="180" fill="#64748B" class="font-regular" font-size="11.5">单机 8 卡总显存 640GB 能否装入模型，</text>
  <text x="798" y="198" fill="#64748B" class="font-regular" font-size="11.5">模型规模处于 30B ~ 70B 区间。</text>
  <rect x="798" y="210" width="234" height="22" rx="5" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="0.8"/>
  <text x="915" y="225" fill="#0F172A" class="font-bold" font-size="11" text-anchor="middle">放不下 ➔ 必须跨节点引入 PP 流水线</text>

  <!-- Horizontal Arrows -->
  <g stroke="#CC6644" stroke-width="2" stroke-dasharray="3 3">
    <line x1="325" y1="167" x2="410" y2="167"/>
    <polygon points="405,163 410,167 405,171" fill="#CC6644"/>

    <line x1="690" y1="167" x2="775" y2="167"/>
    <polygon points="770,163 775,167 770,171" fill="#CC6644"/>
  </g>

  <!-- Final Synthesis Decision Cards -->
  <g transform="translate(45, 275)">
    <g filter="url(#shadow-card)">
      <rect x="0" y="0" width="485" height="150" rx="14" fill="#FFFFFF" stroke="#E5DFD5" stroke-width="1.2"/>
    </g>
    <rect x="20" y="16" width="120" height="22" rx="6" fill="#EFF6FF" stroke="#3B82F6" stroke-width="0.8"/>
    <text x="80" y="31" fill="#1D4ED8" class="font-bold" font-size="11" text-anchor="middle">方案 A · 70B 级</text>
    <text x="155" y="32" fill="#0F172A" class="font-bold" font-size="15">机内 TP=8 + 跨机 ZeRO-3 / FSDP</text>
    <text x="20" y="66" fill="#475569" class="font-regular" font-size="12">• TP 限制在机内 8 卡 NVLink 域（900GB/s 线速），严禁跨机 TP；</text>
    <text x="20" y="88" fill="#475569" class="font-regular" font-size="12">• 跨机数据并行采用 ZeRO-3 / FSDP 按需拉取分片权重；</text>
    <text x="20" y="110" fill="#475569" class="font-regular" font-size="12">• 无任何流水线气泡损失，通信与反向计算高度异步重叠。</text>

    <g filter="url(#shadow-card)">
      <rect x="525" y="0" width="485" height="150" rx="14" fill="#FFFFFF" stroke="#E5DFD5" stroke-width="1.2"/>
    </g>
    <rect x="545" y="16" width="135" height="22" rx="6" fill="#FDF2F8" stroke="#DB2777" stroke-width="0.8"/>
    <text x="612" y="31" fill="#BE185D" class="font-bold" font-size="11" text-anchor="middle">方案 B · 千亿/万亿级</text>
    <text x="695" y="32" fill="#0F172A" class="font-bold" font-size="15">机内 TP=8 + 跨机 PP + ZeRO-1/2</text>
    <text x="545" y="66" fill="#475569" class="font-regular" font-size="12">• 跨节点引入流水线并行 PP（16~32 阶段），仅传层边界激活张量；</text>
    <text x="545" y="88" fill="#475569" class="font-regular" font-size="12">• 采用 1F1B 或 Interleaved 1F1B 双向稳态调度将气泡压至极限；</text>
    <text x="545" y="110" fill="#475569" class="font-regular" font-size="12">• 辅以 ZeRO-1/2 切分优化器状态与梯度，彻底破除万卡显存上限。</text>
  </g>

</svg>