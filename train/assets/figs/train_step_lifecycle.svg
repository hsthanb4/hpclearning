<?xml version="1.0" encoding="UTF-8"?>
<svg width="1100" height="480" viewBox="0 0 1100 480" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .font-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Inter", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; font-weight: 800; }
      .font-bold { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Inter", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; font-weight: 700; }
      .font-medium { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Inter", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; font-weight: 600; }
      .font-regular { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Inter", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; font-weight: 500; }
      .font-mono { font-family: "JetBrains Mono", Menlo, Monaco, Consolas, monospace; font-weight: 700; }
    </style>
    <filter id="shadow-card" x="-2%" y="-4%" width="104%" height="110%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2.5" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>

  <!-- Background Frame -->
  <rect x="0" y="0" width="1100" height="480" rx="18" fill="#FAF9F5" stroke="#E5DFD5" stroke-width="1.5"/>

  <!-- Top Title Bar -->
  <text x="45" y="46" fill="#0F172A" class="font-title" font-size="20" letter-spacing="-0.02em">训练单步迭代的三阶段显存动态吞吐与状态生命周期</text>
  <text x="45" y="68" fill="#64748B" class="font-regular" font-size="12.5">前向激活爬升至峰值 ➔ 反向链式求导锯齿回落 ➔ 优化器更新主权重并清空梯度缓冲</text>

  
  <!-- Stage 01 -->
  <g filter="url(#shadow-card)">
    <rect x="45" y="92" width="1010" height="96" rx="12" fill="#FFFFFF" stroke="#E5DFD5" stroke-width="1.2"/>
  </g>
  <rect x="68" y="108" width="36" height="22" rx="5" fill="#FBF5F2" stroke="#CC6644" stroke-width="1"/>
  <text x="86" y="123" fill="#CC6644" class="font-mono" font-size="11.5" text-anchor="middle">01</text>
  <text x="116" y="124" fill="#0F172A" class="font-bold" font-size="15">阶段一 · 前向传播 (Forward Pass)</text>

  <rect x="820" y="108" width="210" height="22" rx="5" fill="#FFFBEB" stroke="#F59E0B" stroke-width="0.8"/>
  <text x="925" y="123" fill="#F59E0B" class="font-mono" font-size="10" text-anchor="middle">ACTIVATION PEAK</text>

  <text x="68" y="154" fill="#475569" class="font-regular" font-size="12">
    逐层执行前向矩阵乘 GEMM 与激活函数，输出预测值并计算标量 Loss；
  </text>
  <text x="68" y="172" fill="#64748B" class="font-regular" font-size="11.5">
    必须暂存求导所需的中间隐藏状态（动态激活值 Activation），显存随层数爬升至全周期最高峰值。
  </text>

  <line x1="550" y1="190" x2="550" y2="204" stroke="#CC6644" stroke-width="2.2" stroke-dasharray="3 3"/>
  <polygon points="546,204 554,204 550,209" fill="#CC6644"/>

  <!-- Stage 02 -->
  <g filter="url(#shadow-card)">
    <rect x="45" y="208" width="1010" height="96" rx="12" fill="#FFFFFF" stroke="#E5DFD5" stroke-width="1.2"/>
  </g>
  <rect x="68" y="224" width="36" height="22" rx="5" fill="#FBF5F2" stroke="#CC6644" stroke-width="1"/>
  <text x="86" y="239" fill="#CC6644" class="font-mono" font-size="11.5" text-anchor="middle">02</text>
  <text x="116" y="240" fill="#0F172A" class="font-bold" font-size="15">阶段二 · 反向传播 (Backward Pass)</text>

  <rect x="820" y="224" width="210" height="22" rx="5" fill="#F0FDF4" stroke="#10B981" stroke-width="0.8"/>
  <text x="925" y="239" fill="#10B981" class="font-mono" font-size="10" text-anchor="middle">GRADIENT &amp; RELEASE</text>

  <text x="68" y="270" fill="#475569" class="font-regular" font-size="12">
    从 Loss 出发沿计算图逆向链式求导，逐层建立参数梯度缓冲区（Gradients 2N bytes）；
  </text>
  <text x="68" y="288" fill="#64748B" class="font-regular" font-size="11.5">
    对应层的输入激活值在求导完成后立即被显式释放，激活释放与梯度建立交替进行，显存呈现锯齿状回落。
  </text>

  <line x1="550" y1="306" x2="550" y2="320" stroke="#CC6644" stroke-width="2.2" stroke-dasharray="3 3"/>
  <polygon points="546,320 554,320 550,325" fill="#CC6644"/>

  <!-- Stage 03 -->
  <g filter="url(#shadow-card)">
    <rect x="45" y="324" width="1010" height="96" rx="12" fill="#FFFFFF" stroke="#E5DFD5" stroke-width="1.2"/>
  </g>
  <rect x="68" y="340" width="36" height="22" rx="5" fill="#FBF5F2" stroke="#CC6644" stroke-width="1"/>
  <text x="86" y="355" fill="#CC6644" class="font-mono" font-size="11.5" text-anchor="middle">03</text>
  <text x="116" y="356" fill="#0F172A" class="font-bold" font-size="15">阶段三 · 优化器更新 (Optimizer Step)</text>

  <rect x="820" y="340" width="210" height="22" rx="5" fill="#EFF6FF" stroke="#2563EB" stroke-width="0.8"/>
  <text x="925" y="355" fill="#2563EB" class="font-mono" font-size="10" text-anchor="middle">STATE UPDATE &amp; CLEAR</text>

  <text x="68" y="386" fill="#475569" class="font-regular" font-size="12">
    梯度累积完成后，AdamW 读取 FP32 一阶动量 m 与二阶方差 v，结合梯度就地更新 FP32 主权重；
  </text>
  <text x="68" y="404" fill="#64748B" class="font-regular" font-size="11.5">
    更新后的数值截断写回 BF16 参数张量，随后清零或释放梯度缓冲区，显存完全回落至基线静态常驻状态。
  </text>

</svg>