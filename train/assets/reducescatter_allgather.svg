<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 620" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 18px; font-weight: bold; fill: #1e293b; }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 13px; fill: #64748b; }
      .stage-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 15px; font-weight: 600; fill: #0f172a; }
      .stage-badge { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 600; fill: #ffffff; }
      .rank-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 600; fill: #334155; }
      .cell-text { font-family: "SF Mono", Menlo, Monaco, Consolas, monospace; font-size: 12px; font-weight: 500; fill: #1e293b; text-anchor: middle; dominant-baseline: central; }
      .cell-text-bold { font-family: "SF Mono", Menlo, Monaco, Consolas, monospace; font-size: 12px; font-weight: bold; fill: #0f172a; text-anchor: middle; dominant-baseline: central; }
      .note-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 12px; fill: #475569; }
      .arrow { stroke: #64748b; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
      .comm-tag { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 12px; font-weight: bold; fill: #2563eb; }
    </style>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#64748b" />
    </marker>
    <filter id="shadow" x="-3%" y="-4%" width="106%" height="112%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.06"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="920" height="620" rx="12" fill="#f8fafc" />

  <!-- Header -->
  <text x="30" y="38" class="title">AllReduce = ReduceScatter + AllGather 分块状态全流程演进</text>
  <text x="30" y="58" class="subtitle">示例：N = 4 (Rank 0 ~ 3)，每个 Rank 的本地 Tensor 被切分为 4 个分块 [Chunk 0, Chunk 1, Chunk 2, Chunk 3]</text>

  <!-- ================= STAGE 1 ================= -->
  <g transform="translate(30, 80)">
    <rect width="860" height="135" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#shadow)"/>
    <rect x="0" y="0" width="860" height="32" rx="8" fill="#f1f5f9"/>
    <rect x="0" y="24" width="860" height="8" fill="#f1f5f9"/>
    
    <text x="16" y="21" class="stage-title">阶段 0：初始状态（Initial Local Tensors）</text>
    <text x="440" y="21" class="note-text">每张卡持有完整的本地数据，各分块独立尚未求和</text>

    <!-- Rank rows -->
    <!-- Rank 0 -->
    <text x="20" y="56" class="rank-label">Rank 0</text>
    <rect x="90" y="42" width="170" height="22" rx="4" fill="#fee2e2" stroke="#fca5a5"/><text x="175" y="53" class="cell-text">A0 (Chunk 0)</text>
    <rect x="270" y="42" width="170" height="22" rx="4" fill="#fef3c7" stroke="#fcd34d"/><text x="355" y="53" class="cell-text">B0 (Chunk 1)</text>
    <rect x="450" y="42" width="170" height="22" rx="4" fill="#dcfce7" stroke="#86efac"/><text x="535" y="53" class="cell-text">C0 (Chunk 2)</text>
    <rect x="630" y="42" width="170" height="22" rx="4" fill="#e0e7ff" stroke="#a5b4fc"/><text x="715" y="53" class="cell-text">D0 (Chunk 3)</text>

    <!-- Rank 1 -->
    <text x="20" y="80" class="rank-label">Rank 1</text>
    <rect x="90" y="66" width="170" height="22" rx="4" fill="#fee2e2" stroke="#fca5a5"/><text x="175" y="77" class="cell-text">A1 (Chunk 0)</text>
    <rect x="270" y="66" width="170" height="22" rx="4" fill="#fef3c7" stroke="#fcd34d"/><text x="355" y="77" class="cell-text">B1 (Chunk 1)</text>
    <rect x="450" y="66" width="170" height="22" rx="4" fill="#dcfce7" stroke="#86efac"/><text x="535" y="77" class="cell-text">C1 (Chunk 2)</text>
    <rect x="630" y="66" width="170" height="22" rx="4" fill="#e0e7ff" stroke="#a5b4fc"/><text x="715" y="77" class="cell-text">D1 (Chunk 3)</text>

    <!-- Rank 2 -->
    <text x="20" y="104" class="rank-label">Rank 2</text>
    <rect x="90" y="90" width="170" height="22" rx="4" fill="#fee2e2" stroke="#fca5a5"/><text x="175" y="101" class="cell-text">A2 (Chunk 0)</text>
    <rect x="270" y="90" width="170" height="22" rx="4" fill="#fef3c7" stroke="#fcd34d"/><text x="355" y="101" class="cell-text">B2 (Chunk 1)</text>
    <rect x="450" y="90" width="170" height="22" rx="4" fill="#dcfce7" stroke="#86efac"/><text x="535" y="101" class="cell-text">C2 (Chunk 2)</text>
    <rect x="630" y="90" width="170" height="22" rx="4" fill="#e0e7ff" stroke="#a5b4fc"/><text x="715" y="101" class="cell-text">D2 (Chunk 3)</text>

    <!-- Rank 3 -->
    <text x="20" y="128" class="rank-label">Rank 3</text>
    <rect x="90" y="114" width="170" height="22" rx="4" fill="#fee2e2" stroke="#fca5a5"/><text x="175" y="125" class="cell-text">A3 (Chunk 0)</text>
    <rect x="270" y="114" width="170" height="22" rx="4" fill="#fef3c7" stroke="#fcd34d"/><text x="355" y="125" class="cell-text">B3 (Chunk 1)</text>
    <rect x="450" y="114" width="170" height="22" rx="4" fill="#dcfce7" stroke="#86efac"/><text x="535" y="125" class="cell-text">C3 (Chunk 2)</text>
    <rect x="630" y="114" width="170" height="22" rx="4" fill="#e0e7ff" stroke="#a5b4fc"/><text x="715" y="125" class="cell-text">D3 (Chunk 3)</text>
  </g>

  <!-- Arrow 1: ReduceScatter -->
  <g transform="translate(460, 222)">
    <line x1="0" y1="0" x2="0" y2="28" class="arrow"/>
    <rect x="-190" y="4" width="380" height="20" rx="10" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="0" y="18" text-anchor="middle" class="comm-tag">① ReduceScatter 通信（各卡发送量 = (N-1)/N · K ≈ K）</text>
  </g>

  <!-- ================= STAGE 2 ================= -->
  <g transform="translate(30, 258)">
    <rect width="860" height="142" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#shadow)"/>
    <rect x="0" y="0" width="860" height="32" rx="8" fill="#f8fafc"/>
    <rect x="0" y="24" width="860" height="8" fill="#f8fafc"/>
    
    <text x="16" y="21" class="stage-title">阶段 1：ReduceScatter 完成后（每卡只保留属于自己的 1/N 全局规约块）</text>
    <text x="520" y="21" class="note-text">★ ZeRO-1/2 状态：显存降至 1/N</text>

    <!-- Rank 0 -->
    <text x="20" y="58" class="rank-label">Rank 0</text>
    <rect x="90" y="44" width="170" height="23" rx="4" fill="#ef4444" stroke="#b91c1c"/><text x="175" y="55" class="cell-text-bold" fill="#ffffff">Σ A_i (Chunk 0)</text>
    <rect x="270" y="44" width="530" height="23" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-dasharray="4 3"/><text x="535" y="55" class="note-text" fill="#94a3b8">—— 非负责分块已释放/未聚合 (Free) ——</text>

    <!-- Rank 1 -->
    <text x="20" y="83" class="rank-label">Rank 1</text>
    <rect x="90" y="69" width="170" height="23" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-dasharray="4 3"/><text x="175" y="80" class="note-text" fill="#94a3b8">—— Free ——</text>
    <rect x="270" y="69" width="170" height="23" rx="4" fill="#f59e0b" stroke="#b45309"/><text x="355" y="80" class="cell-text-bold" fill="#ffffff">Σ B_i (Chunk 1)</text>
    <rect x="450" y="69" width="350" height="23" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-dasharray="4 3"/><text x="625" y="80" class="note-text" fill="#94a3b8">—— Free ——</text>

    <!-- Rank 2 -->
    <text x="20" y="108" class="rank-label">Rank 2</text>
    <rect x="90" y="94" width="350" height="23" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-dasharray="4 3"/><text x="265" y="105" class="note-text" fill="#94a3b8">—— Free ——</text>
    <rect x="450" y="94" width="170" height="23" rx="4" fill="#10b981" stroke="#047857"/><text x="535" y="105" class="cell-text-bold" fill="#ffffff">Σ C_i (Chunk 2)</text>
    <rect x="630" y="94" width="170" height="23" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-dasharray="4 3"/><text x="715" y="105" class="note-text" fill="#94a3b8">—— Free ——</text>

    <!-- Rank 3 -->
    <text x="20" y="133" class="rank-label">Rank 3</text>
    <rect x="90" y="119" width="530" height="23" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-dasharray="4 3"/><text x="355" y="130" class="note-text" fill="#94a3b8">—— Free ——</text>
    <rect x="630" y="119" width="170" height="23" rx="4" fill="#6366f1" stroke="#4338ca"/><text x="715" y="130" class="cell-text-bold" fill="#ffffff">Σ D_i (Chunk 3)</text>
  </g>

  <!-- Arrow 2: AllGather -->
  <g transform="translate(460, 407)">
    <line x1="0" y1="0" x2="0" y2="28" class="arrow"/>
    <rect x="-180" y="4" width="360" height="20" rx="10" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="0" y="18" text-anchor="middle" class="comm-tag">② AllGather 通信（各卡发送量 = (N-1)/N · K ≈ K）</text>
  </g>

  <!-- ================= STAGE 3 ================= -->
  <g transform="translate(30, 443)">
    <rect width="860" height="142" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5" filter="url(#shadow)"/>
    <rect x="0" y="0" width="860" height="32" rx="8" fill="#f1f5f9"/>
    <rect x="0" y="24" width="860" height="8" fill="#f1f5f9"/>
    
    <text x="16" y="21" class="stage-title">阶段 2：AllGather 完成后（全收集拼接完成 = 全局 AllReduce 结果）</text>
    <text x="500" y="21" class="note-text">每张卡重新拼回大小为 K 的全部规约分块</text>

    <!-- Rank 0 -->
    <text x="20" y="58" class="rank-label">Rank 0</text>
    <rect x="90" y="44" width="170" height="22" rx="4" fill="#ef4444" stroke="#b91c1c"/><text x="175" y="55" class="cell-text-bold" fill="#ffffff">Σ A_i (Chunk 0)</text>
    <rect x="270" y="44" width="170" height="22" rx="4" fill="#f59e0b" stroke="#b45309"/><text x="355" y="55" class="cell-text-bold" fill="#ffffff">Σ B_i (Chunk 1)</text>
    <rect x="450" y="44" width="170" height="22" rx="4" fill="#10b981" stroke="#047857"/><text x="535" y="55" class="cell-text-bold" fill="#ffffff">Σ C_i (Chunk 2)</text>
    <rect x="630" y="44" width="170" height="22" rx="4" fill="#6366f1" stroke="#4338ca"/><text x="715" y="55" class="cell-text-bold" fill="#ffffff">Σ D_i (Chunk 3)</text>

    <!-- Rank 1 -->
    <text x="20" y="83" class="rank-label">Rank 1</text>
    <rect x="90" y="69" width="170" height="22" rx="4" fill="#ef4444" stroke="#b91c1c"/><text x="175" y="80" class="cell-text-bold" fill="#ffffff">Σ A_i (Chunk 0)</text>
    <rect x="270" y="69" width="170" height="22" rx="4" fill="#f59e0b" stroke="#b45309"/><text x="355" y="80" class="cell-text-bold" fill="#ffffff">Σ B_i (Chunk 1)</text>
    <rect x="450" y="69" width="170" height="22" rx="4" fill="#10b981" stroke="#047857"/><text x="535" y="80" class="cell-text-bold" fill="#ffffff">Σ C_i (Chunk 2)</text>
    <rect x="630" y="69" width="170" height="22" rx="4" fill="#6366f1" stroke="#4338ca"/><text x="715" y="80" class="cell-text-bold" fill="#ffffff">Σ D_i (Chunk 3)</text>

    <!-- Rank 2 -->
    <text x="20" y="108" class="rank-label">Rank 2</text>
    <rect x="90" y="94" width="170" height="22" rx="4" fill="#ef4444" stroke="#b91c1c"/><text x="175" y="105" class="cell-text-bold" fill="#ffffff">Σ A_i (Chunk 0)</text>
    <rect x="270" y="94" width="170" height="22" rx="4" fill="#f59e0b" stroke="#b45309"/><text x="355" y="105" class="cell-text-bold" fill="#ffffff">Σ B_i (Chunk 1)</text>
    <rect x="450" y="94" width="170" height="22" rx="4" fill="#10b981" stroke="#047857"/><text x="535" y="105" class="cell-text-bold" fill="#ffffff">Σ C_i (Chunk 2)</text>
    <rect x="630" y="94" width="170" height="22" rx="4" fill="#6366f1" stroke="#4338ca"/><text x="715" y="105" class="cell-text-bold" fill="#ffffff">Σ D_i (Chunk 3)</text>

    <!-- Rank 3 -->
    <text x="20" y="133" class="rank-label">Rank 3</text>
    <rect x="90" y="119" width="170" height="22" rx="4" fill="#ef4444" stroke="#b91c1c"/><text x="175" y="130" class="cell-text-bold" fill="#ffffff">Σ A_i (Chunk 0)</text>
    <rect x="270" y="119" width="170" height="22" rx="4" fill="#f59e0b" stroke="#b45309"/><text x="355" y="130" class="cell-text-bold" fill="#ffffff">Σ B_i (Chunk 1)</text>
    <rect x="450" y="119" width="170" height="22" rx="4" fill="#10b981" stroke="#047857"/><text x="535" y="130" class="cell-text-bold" fill="#ffffff">Σ C_i (Chunk 2)</text>
    <rect x="630" y="119" width="170" height="22" rx="4" fill="#6366f1" stroke="#4338ca"/><text x="715" y="130" class="cell-text-bold" fill="#ffffff">Σ D_i (Chunk 3)</text>
  </g>

  <!-- Summary Footer -->
  <text x="460" y="604" text-anchor="middle" class="note-text" font-weight="600">通信量总结：ReduceScatter 发送 (N-1)/N · K + AllGather 发送 (N-1)/N · K = AllReduce 发送 2(N-1)/N · K ≈ 2K（各自恰为 50%）</text>
</svg>