<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 940" width="100%" height="100%">
  <defs>
    <style>
      .main-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; font-size: 20px; font-weight: 800; fill: #0f172a; }
      .main-subtitle { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; font-size: 13px; fill: #475569; }
      .stage-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; font-size: 13px; font-weight: 700; fill: #1e293b; }
      .badge-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; font-size: 11px; font-weight: 700; fill: #ffffff; text-anchor: middle; dominant-baseline: central; }
      .comm-badge { font-family: "SF Mono", Menlo, Monaco, Consolas, monospace; font-size: 11px; font-weight: 700; text-anchor: middle; dominant-baseline: central; }
      .step-header { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; font-size: 12px; font-weight: 700; fill: #334155; }
      .code-font { font-family: "SF Mono", Menlo, Monaco, Consolas, monospace; font-size: 11px; font-weight: 600; text-anchor: middle; dominant-baseline: central; }
      .desc-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; font-size: 11px; fill: #475569; }
      .desc-bold { font-weight: 700; fill: #0f172a; }
      .arrow-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; font-size: 11px; font-weight: 700; text-anchor: middle; }
    </style>
    <filter id="card-shadow" x="-2%" y="-3%" width="104%" height="108%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.05"/>
    </filter>
    <marker id="arrow-blue" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2563eb" />
    </marker>
    <marker id="arrow-amber" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#d97706" />
    </marker>
    <marker id="arrow-slate" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#64748b" />
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect width="960" height="940" rx="14" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5" />

  <!-- Top Title Bar -->
  <g transform="translate(36, 32)">
    <text x="0" y="8" class="main-title">ZeRO-3 (FSDP) 每训练步通信与显存状态流转全景图</text>
    <text x="0" y="30" class="main-subtitle">三项全部分片 (参数/梯度/优化器各占 1/Nd) · 按层动态 All-Gather 与 Reduce-Scatter · 单步总通信量 = 3Ψ</text>
  </g>

  <!-- ==================== STAGE 1: FORWARD PASS ==================== -->
  <g transform="translate(36, 84)">
    <!-- Card Base -->
    <rect width="888" height="216" rx="10" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.5" filter="url(#card-shadow)" />
    <!-- Header banner -->
    <rect width="888" height="38" rx="10" fill="#eff6ff" />
    <rect y="26" width="888" height="12" fill="#eff6ff" />
    <!-- Badge -->
    <rect x="12" y="8" width="200" height="22" rx="5" fill="#2563eb" />
    <text x="112" y="19" class="badge-text">阶段 1 · 前向传播 (Forward)</text>
    <text x="224" y="24" class="stage-title">逐层动态收集全量权重，前向计算完成后立即丢弃</text>
    <!-- Comm pill -->
    <rect x="736" y="8" width="140" height="22" rx="11" fill="#dbeafe" stroke="#93c5fd" />
    <text x="806" y="19" class="comm-badge" fill="#1d4ed8">通信量: 1 × Ψ</text>

    <!-- Content 3 steps -->
    <!-- Step 1.1: Local Shards -->
    <g transform="translate(18, 48)">
      <text x="0" y="14" class="step-header">① 常驻分片状态 (1/Nd)</text>
      <text x="0" y="30" class="desc-text">静态显存仅存 1/Nd 权重</text>
      <!-- Ranks -->
      <g transform="translate(0, 38)">
        <rect x="0" y="0" width="48" height="20" rx="3" fill="#f1f5f9"/><text x="24" y="10" class="code-font" fill="#475569">Rank0</text>
        <rect x="52" y="0" width="140" height="20" rx="3" fill="#dbeafe" stroke="#93c5fd"/><text x="122" y="10" class="code-font" fill="#1e40af">W0 (1/Nd Shard)</text>

        <rect x="0" y="24" width="48" height="20" rx="3" fill="#f1f5f9"/><text x="24" y="34" class="code-font" fill="#475569">Rank1</text>
        <rect x="52" y="24" width="140" height="20" rx="3" fill="#dbeafe" stroke="#93c5fd"/><text x="122" y="34" class="code-font" fill="#1e40af">W1 (1/Nd Shard)</text>

        <rect x="0" y="48" width="48" height="20" rx="3" fill="#f1f5f9"/><text x="24" y="58" class="code-font" fill="#475569">Rank2</text>
        <rect x="52" y="48" width="140" height="20" rx="3" fill="#dbeafe" stroke="#93c5fd"/><text x="122" y="58" class="code-font" fill="#1e40af">W2 (1/Nd Shard)</text>

        <rect x="0" y="72" width="48" height="20" rx="3" fill="#f1f5f9"/><text x="24" y="82" class="code-font" fill="#475569">Rank3</text>
        <rect x="52" y="72" width="140" height="20" rx="3" fill="#dbeafe" stroke="#93c5fd"/><text x="122" y="82" class="code-font" fill="#1e40af">W3 (1/Nd Shard)</text>
      </g>
    </g>

    <!-- Arrow 1 -> 2 -->
    <g transform="translate(222, 126)">
      <line x1="0" y1="0" x2="52" y2="0" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
      <text x="26" y="-10" class="arrow-label" fill="#2563eb">All-Gather</text>
      <text x="26" y="16" class="desc-text" text-anchor="middle" fill="#1d4ed8">通信量 Ψ_l</text>
    </g>

    <!-- Step 1.2: All-Gather Full Weights -->
    <g transform="translate(288, 48)">
      <text x="0" y="14" class="step-header">② 重构全量并前向计算</text>
      <text x="0" y="30" class="desc-text">所有 GPU 临时持有完整该层权重</text>
      <!-- Full weight block -->
      <g transform="translate(0, 38)">
        <rect width="254" height="42" rx="5" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5" />
        <rect x="5" y="6" width="56" height="30" rx="3" fill="#bfdbfe"/><text x="33" y="21" class="code-font" fill="#1e3a8a">W[0]</text>
        <rect x="66" y="6" width="56" height="30" rx="3" fill="#bfdbfe"/><text x="94" y="21" class="code-font" fill="#1e3a8a">W[1]</text>
        <rect x="127" y="6" width="56" height="30" rx="3" fill="#bfdbfe"/><text x="155" y="21" class="code-font" fill="#1e3a8a">W[2]</text>
        <rect x="188" y="6" width="56" height="30" rx="3" fill="#bfdbfe"/><text x="216" y="21" class="code-font" fill="#1e3a8a">W[3]</text>
      </g>
      <!-- Compute notation -->
      <rect x="0" y="90" width="254" height="46" rx="5" fill="#f8fafc" stroke="#cbd5e1"/>
      <text x="12" y="108" class="desc-text"><tspan class="desc-bold">前向计算：</tspan> Y = Activation(X · W)</text>
      <text x="12" y="125" class="desc-text"><tspan class="desc-bold">保留激活：</tspan> 激活值存入显存用于反向求导</text>
    </g>

    <!-- Arrow 2 -> 3 -->
    <g transform="translate(554, 126)">
      <line x1="0" y1="0" x2="52" y2="0" stroke="#64748b" stroke-width="2" marker-end="url(#arrow-slate)"/>
      <text x="26" y="-10" class="arrow-label" fill="#dc2626">用完即丢</text>
      <text x="26" y="16" class="desc-text" text-anchor="middle" fill="#64748b">释放全量权重</text>
    </g>

    <!-- Step 1.3: Immediate Free -->
    <g transform="translate(620, 48)">
      <text x="0" y="14" class="step-header">③ 瞬时释放全量权重</text>
      <text x="0" y="30" class="desc-text">显存降回基准分片状态</text>
      <rect x="0" y="38" width="250" height="98" rx="5" fill="#f0fdf4" stroke="#86efac" stroke-dasharray="4 3"/>
      <text x="16" y="64" class="desc-text"><tspan fill="#15803d" font-weight="700">✓ 内存峰值仅维持单层计算耗时</tspan></text>
      <text x="16" y="84" class="desc-text">• 全量 BF16 临时权重立即被释放丢弃</text>
      <text x="16" y="102" class="desc-text">• 本卡仅继续保留属于自己的 1/Nd 权重</text>
      <text x="16" y="120" class="desc-text">• <tspan fill="#2563eb" font-weight="700">累计前向总通信量 = 1 × Ψ</tspan></text>
    </g>
  </g>

  <!-- ==================== STAGE 2: BACKWARD PASS ==================== -->
  <g transform="translate(36, 318)">
    <!-- Card Base -->
    <rect width="888" height="236" rx="10" fill="#ffffff" stroke="#fed7aa" stroke-width="1.5" filter="url(#card-shadow)" />
    <!-- Header banner -->
    <rect width="888" height="38" rx="10" fill="#fff7ed" />
    <rect y="26" width="888" height="12" fill="#fff7ed" />
    <!-- Badge -->
    <rect x="12" y="8" width="200" height="22" rx="5" fill="#ea580c" />
    <text x="112" y="19" class="badge-text">阶段 2 · 反向传播 (Backward)</text>
    <text x="224" y="24" class="stage-title">逆序逐层：再次取权重求导 + 规约切分聚合梯度</text>
    <!-- Comm pill -->
    <rect x="716" y="8" width="160" height="22" rx="11" fill="#ffedd5" stroke="#fdba74" />
    <text x="796" y="19" class="comm-badge" fill="#c2410c">通信量: Ψ + Ψ = 2Ψ</text>

    <!-- Content 3 steps -->
    <!-- Step 2.1: 2nd All-Gather -->
    <g transform="translate(18, 48)">
      <text x="0" y="14" class="step-header">① 再次 All-Gather 权重</text>
      <text x="0" y="30" class="desc-text">因前向已释放，求导需重新拼装</text>
      
      <!-- Top action box -->
      <rect x="0" y="38" width="230" height="42" rx="5" fill="#fff7ed" stroke="#f97316" stroke-width="1.5" />
      <text x="115" y="59" class="code-font" fill="#9a3412">All-Gather: 重新拼装 W[l]</text>
      
      <!-- Explanation box -->
      <rect x="0" y="88" width="230" height="76" rx="5" fill="#f8fafc" stroke="#cbd5e1" />
      <text x="12" y="108" class="desc-text"><tspan class="desc-bold">为什么反向要再通信一次？</tspan></text>
      <text x="12" y="126" class="desc-text">求权重梯度 ∇W 需要前向输入与激活</text>
      <text x="12" y="144" class="desc-text"><tspan fill="#ea580c" font-weight="700">通信量贡献：+ 1 × Ψ</tspan></text>
    </g>

    <!-- Arrow 1 -> 2 -->
    <g transform="translate(254, 107)">
      <line x1="0" y1="0" x2="36" y2="0" stroke="#d97706" stroke-width="2" marker-end="url(#arrow-amber)"/>
    </g>

    <!-- Step 2.2: Compute Gradients & Free Weight -->
    <g transform="translate(296, 48)">
      <text x="0" y="14" class="step-header">② 反向求导并再次丢弃权重</text>
      <text x="0" y="30" class="desc-text">生成全量梯度 ∇W 与激活梯度 ∇X</text>

      <!-- Top action box -->
      <rect x="0" y="38" width="240" height="42" rx="5" fill="#fef3c7" stroke="#d97706" />
      <text x="120" y="59" class="code-font" fill="#b45309">反向计算: 得到 ∇W_全量</text>

      <!-- Free box -->
      <rect x="0" y="88" width="240" height="76" rx="5" fill="#fff1f2" stroke="#fecdd3"/>
      <text x="12" y="108" class="desc-text"><tspan fill="#e11d48" font-weight="700">丢弃全量权重与当前激活：</tspan></text>
      <text x="12" y="126" class="desc-text">• 全量权重 W 再次立即丢弃 (Free)</text>
      <text x="12" y="144" class="desc-text">• 该层前向激活显存也立即释放</text>
    </g>

    <!-- Arrow 2 -> 3 -->
    <g transform="translate(542, 107)">
      <line x1="0" y1="0" x2="36" y2="0" stroke="#d97706" stroke-width="2" marker-end="url(#arrow-amber)"/>
    </g>

    <!-- Step 2.3: Reduce-Scatter Gradients -->
    <g transform="translate(584, 48)">
      <text x="0" y="14" class="step-header">③ Reduce-Scatter 聚合梯度</text>
      <text x="0" y="30" class="desc-text">跨卡累加求和，每卡仅留属于自己的 1/Nd</text>

      <!-- Ranks grad -->
      <g transform="translate(0, 38)">
        <rect x="0" y="0" width="48" height="20" rx="3" fill="#f1f5f9"/><text x="24" y="10" class="code-font" fill="#475569">Rank0</text>
        <rect x="52" y="0" width="234" height="20" rx="3" fill="#fed7aa" stroke="#f97316"/><text x="169" y="10" class="code-font" fill="#9a3412">Σ ∇W_0 (仅存 1/Nd 梯度)</text>

        <rect x="0" y="24" width="48" height="20" rx="3" fill="#f1f5f9"/><text x="24" y="34" class="code-font" fill="#475569">Rank1</text>
        <rect x="52" y="24" width="234" height="20" rx="3" fill="#fed7aa" stroke="#f97316"/><text x="169" y="34" class="code-font" fill="#9a3412">Σ ∇W_1 (仅存 1/Nd 梯度)</text>

        <rect x="0" y="48" width="48" height="20" rx="3" fill="#f1f5f9"/><text x="24" y="58" class="code-font" fill="#475569">Rank2</text>
        <rect x="52" y="48" width="234" height="20" rx="3" fill="#fed7aa" stroke="#f97316"/><text x="169" y="58" class="code-font" fill="#9a3412">Σ ∇W_2 (仅存 1/Nd 梯度)</text>

        <rect x="0" y="72" width="48" height="20" rx="3" fill="#f1f5f9"/><text x="24" y="82" class="code-font" fill="#475569">Rank3</text>
        <rect x="52" y="72" width="234" height="20" rx="3" fill="#fed7aa" stroke="#f97316"/><text x="169" y="82" class="code-font" fill="#9a3412">Σ ∇W_3 (仅存 1/Nd 梯度)</text>
      </g>
      
      <text x="52" y="152" class="desc-text"><tspan fill="#ea580c" font-weight="700">通信量贡献：+ 1 × Ψ</tspan> (其余非本卡梯度丢弃)</text>
    </g>
  </g>

  <!-- ==================== STAGE 3: OPTIMIZER STEP ==================== -->
  <g transform="translate(36, 572)">
    <!-- Card Base -->
    <rect width="888" height="155" rx="10" fill="#ffffff" stroke="#a7f3d0" stroke-width="1.5" filter="url(#card-shadow)" />
    <!-- Header banner -->
    <rect width="888" height="38" rx="10" fill="#ecfdf5" />
    <rect y="26" width="888" height="12" fill="#ecfdf5" />
    <!-- Badge -->
    <rect x="12" y="8" width="240" height="22" rx="5" fill="#059669" />
    <text x="132" y="19" class="badge-text">阶段 3 · 优化器更新 (Optimizer Step)</text>
    <text x="264" y="24" class="stage-title">各卡仅用本地 1/Nd 梯度分片更新本卡状态</text>
    <!-- Comm pill -->
    <rect x="746" y="8" width="130" height="22" rx="11" fill="#d1fae5" stroke="#6ee7b7" />
    <text x="811" y="19" class="comm-badge" fill="#047857">跨卡通信量: 0</text>

    <!-- Content Columns -->
    <g transform="translate(18, 48)">
      <rect width="262" height="92" rx="6" fill="#f0fdf4" stroke="#bbf7d0"/>
      <text x="14" y="24" class="step-header">① 输入：本地 1/Nd 梯度分片</text>
      <text x="14" y="46" class="desc-text">• 每张卡仅持对应 index 的分片</text>
      <text x="14" y="66" class="desc-text">• 无需其他卡的梯度信息</text>
      <text x="14" y="84" class="desc-text"><tspan fill="#059669" font-weight="700">完全无跨卡通信需求 (0 Comm)</tspan></text>
    </g>

    <g transform="translate(298, 48)">
      <rect width="276" height="92" rx="6" fill="#f0fdf4" stroke="#bbf7d0"/>
      <text x="14" y="24" class="step-header">② 状态更新：FP32 Adam (12Ψ/Nd)</text>
      <text x="14" y="46" class="desc-text">• m_i = β1·m_i + (1-β1)·∇W_i (4 字节)</text>
      <text x="14" y="66" class="desc-text">• v_i = β2·v_i + (1-β2)·∇W_i² (4 字节)</text>
      <text x="14" y="84" class="desc-text">• 更新 FP32 Master Weight 分片 (4 字节)</text>
    </g>

    <g transform="translate(592, 48)">
      <rect width="278" height="92" rx="6" fill="#f0fdf4" stroke="#bbf7d0"/>
      <text x="14" y="24" class="step-header">③ 输出：新 BF16 权重分片 (2Ψ/Nd)</text>
      <text x="14" y="46" class="desc-text">• Master Weight 转换为 BF16 (2 字节)</text>
      <text x="14" y="66" class="desc-text">• 保留为下一轮迭代的常驻分片</text>
      <text x="14" y="84" class="desc-text"><tspan fill="#047857" font-weight="700">循环完成！进入下一步迭代 Step</tspan></text>
    </g>
  </g>

  <!-- ==================== FOOTER: PREFETCH OVERLAP ==================== -->
  <g transform="translate(36, 745)">
    <rect width="888" height="160" rx="8" fill="#ffffff" stroke="#c7d2fe" stroke-width="1.5" filter="url(#card-shadow)" />
    <rect width="888" height="32" rx="8" fill="#eef2ff" />
    <rect y="22" width="888" height="10" fill="#eef2ff" />
    
    <!-- Badge -->
    <rect x="12" y="6" width="160" height="20" rx="4" fill="#4f46e5" />
    <text x="92" y="16" class="badge-text">底层优化 · Prefetch 预取</text>
    <text x="184" y="21" class="stage-title" fill="#3730a3">计算流与独立 CUDA 通信流重叠，隐藏 3Ψ 中大部分通信开销</text>

    <g transform="translate(18, 42)">
      <!-- Stream 1: Compute -->
      <rect x="0" y="4" width="115" height="26" rx="4" fill="#e0e7ff"/><text x="57" y="17" class="code-font" fill="#3730a3">计算流 (Compute)</text>
      <rect x="125" y="4" width="225" height="26" rx="4" fill="#dbeafe" stroke="#93c5fd"/><text x="237" y="17" class="code-font" fill="#1e40af">计算 Layer n 前向</text>
      <rect x="360" y="4" width="225" height="26" rx="4" fill="#dbeafe" stroke="#93c5fd"/><text x="472" y="17" class="code-font" fill="#1e40af">计算 Layer n+1 前向</text>
      <rect x="595" y="4" width="255" height="26" rx="4" fill="#f1f5f9"/><text x="722" y="17" class="code-font" fill="#64748b">流水线连续无缝执行...</text>

      <!-- Stream 2: Comm -->
      <rect x="0" y="36" width="115" height="26" rx="4" fill="#ede9fe"/><text x="57" y="49" class="code-font" fill="#5b21b6">通信流 (Comm)</text>
      <rect x="125" y="36" width="225" height="26" rx="4" fill="#fee2e2" stroke="#fca5a5"/><text x="237" y="49" class="code-font" fill="#991b1b">All-Gather Layer n+1 (预取)</text>
      <rect x="360" y="36" width="225" height="26" rx="4" fill="#fee2e2" stroke="#fca5a5"/><text x="472" y="49" class="code-font" fill="#991b1b">All-Gather Layer n+2 (预取)</text>
      <rect x="595" y="36" width="255" height="26" rx="4" fill="#fef3c7" stroke="#fde68a"/><text x="722" y="49" class="code-font" fill="#92400e">⚠️ 瓶颈：DP>512 时通信时间 &gt; 计算时间</text>
    </g>
    
    <!-- 2-line wrapped text with comfortable line-height -->
    <text x="20" y="122" class="desc-text">
      <tspan x="20" dy="0"><tspan font-weight="700" fill="#0f172a">经验法则与限制：</tspan> Prefetch 能把前向与反向的参数 All-Gather 成功隐藏在上一层计算耗时内；</tspan>
      <tspan x="20" dy="18">但当 DP 规模超过约 512 卡时，Ring Latency 累积导致网络通信时间超过计算时间，通信将无法完全重叠隐藏。</tspan>
    </text>
  </g>
</svg>
