format:
  html:
    theme:
      light: cosmo
      dark: darkly
    toc: true
    toc-depth: 3
    toc-title: "本页目录"
    number-sections: false
    smooth-scroll: true
    code-fold: show
    code-tools: true
    code-copy: true
    code-overflow: wrap
    highlight-style: github

execute:
  freeze: auto
  eval: false
