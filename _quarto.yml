project:
  type: website
  output-dir: _site
  resources:
    - "**/*.svg"
    - "**/*.png"
    - "**/*.jpeg"
    - "**/*.jpg"
    - "**/*.excalidraw"
    - "**/*.html"
  render:
    - "index.qmd"
    - "train/*.qmd"
    - "cuda/*.qmd"
    - "cutlass/*.qmd"
    - "triton/*.qmd"
    - "triton/*/*.qmd"
    - "mlir/*.qmd"
    - "rl/*.qmd"
    - "inference/*.qmd"
    - "inference/*/*.qmd"
    - "runtime/*.qmd"
    - "platform/*.qmd"

website:
  title: "HPC / AI Infra 面试课程"
  description: "HPC 与 AI Infra 面试高频考点、算子实现与源码拆解（全模块参考答案版）"
  site-url: "https://hsthanb4.github.io/hpclearning/"
  repo-url: "https://github.com/hsthanb4/hpclearning"
  repo-branch: "answer"
  issue-url: "https://github.com/hsthanb4/hpclearning/issues"
  navbar:
    title: "HPC & AI Infra"
    background: primary
    search: true
    left:
      - href: index.qmd
        text: "首页"
      - text: "核心主线"
