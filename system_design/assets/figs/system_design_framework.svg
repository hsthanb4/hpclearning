<?xml version="1.0" encoding="UTF-8"?>
<svg width="1100" height="595" viewBox="0 0 1100 595" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .font-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Inter", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; font-weight: 800; }
      .font-bold { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Inter", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; font-weight: 700; }
      .font-medium { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Inter", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; font-weight: 600; }
      .font-regular { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Inter", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; font-weight: 500; }
      .font-mono { font-family: "JetBrains Mono", Menlo, Monaco, Consolas, monospace; font-weight: 700; }
    </style>
    <filter id="shadow-card" x="-2%" y="-4%" width="104%" height="110%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2.5" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>

  <!-- Background Frame -->
  <rect x="0" y="0" width="1100" height="595" rx="18" fill="#FAF9F5" stroke="#E5DFD5" stroke-width="1.5"/>

  <!-- Top Title Bar -->
  <text x="45" y="46" fill="#0F172A" class="font-title" font-size="20" letter-spacing="-0.02em">AI 基础设施系统设计四步标准化推演框架</text>
  <text x="45" y="68" fill="#64748B" class="font-regular" font-size="12.5">从容量物理边界测算、网络导轨对齐到 5D 并行切分与 Daly 容错自愈的工业级闭环方法论</text>

  
  <!-- Step 01 -->
  <g filter="url(#shadow-card)">
    <rect x="45" y="92" width="1010" height="106" rx="12" fill="#FFFFFF" stroke="#E5DFD5" stroke-width="1.2"/>
  </g>

  <!-- Number Pill -->
  <rect x="68" y="108" width="40" height="24" rx="6" fill="#FBF5F2" stroke="#CC6644" stroke-width="1"/>
  <text x="88" y="124.5" fill="#CC6644" class="font-mono" font-size="12" text-anchor="middle">01</text>

  <!-- Step Title -->
  <text x="120" y="125" fill="#0F172A" class="font-bold" font-size="15" letter-spacing="-0.01em">步骤 1：需求拆解与物理边界估算</text>

  <!-- Step Tag -->
  <rect x="815" y="108" width="215" height="24" rx="6" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="923" y="124.5" fill="#64748B" class="font-mono" font-size="10.5" text-anchor="middle">CAPACITY &amp; BOUND</text>

  <!-- Description -->
  <text x="68" y="158" fill="#475569" class="font-regular" font-size="12.5">
    估算模型参数规模 Φ、静态显存（16Φ）与动态激活值；推导集群所需 GPU 张数与交付周期；锚定 TTFT &lt; 100ms 与 TPOT &lt; 20ms 等核心 SLO 延迟指标。
  </text>

  <line x1="550" y1="200" x2="550" y2="214" stroke="#CC6644" stroke-width="2.2" stroke-dasharray="3 3"/>
  <polygon points="546,214 554,214 550,219" fill="#CC6644"/>

  <!-- Step 02 -->
  <g filter="url(#shadow-card)">
    <rect x="45" y="218" width="1010" height="106" rx="12" fill="#FFFFFF" stroke="#E5DFD5" stroke-width="1.2"/>
  </g>

  <!-- Number Pill -->
  <rect x="68" y="234" width="40" height="24" rx="6" fill="#FBF5F2" stroke="#CC6644" stroke-width="1"/>
  <text x="88" y="250.5" fill="#CC6644" class="font-mono" font-size="12" text-anchor="middle">02</text>

  <!-- Step Title -->
  <text x="120" y="251" fill="#0F172A" class="font-bold" font-size="15" letter-spacing="-0.01em">步骤 2：硬件拓扑与设备网格编排</text>

  <!-- Step Tag -->
  <rect x="815" y="234" width="215" height="24" rx="6" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="923" y="250.5" fill="#64748B" class="font-mono" font-size="10.5" text-anchor="middle">TOPOLOGY &amp; RAIL-ALIGNMENT</text>

  <!-- Description -->
  <text x="68" y="284" fill="#475569" class="font-regular" font-size="12.5">
    设计机内 NVLink 高速域（900GB/s ~ 1.8TB/s）与跨机 8-Rail RoCE/IB 网络拓扑；实施导轨无冲突对齐，彻底消除跨 TOR 交换机拥塞与微突发丢包。
  </text>

  <line x1="550" y1="326" x2="550" y2="340" stroke="#CC6644" stroke-width="2.2" stroke-dasharray="3 3"/>
  <polygon points="546,340 554,340 550,345" fill="#CC6644"/>

  <!-- Step 03 -->
  <g filter="url(#shadow-card)">
    <rect x="45" y="344" width="1010" height="106" rx="12" fill="#FFFFFF" stroke="#E5DFD5" stroke-width="1.2"/>
  </g>

  <!-- Number Pill -->
  <rect x="68" y="360" width="40" height="24" rx="6" fill="#FBF5F2" stroke="#CC6644" stroke-width="1"/>
  <text x="88" y="376.5" fill="#CC6644" class="font-mono" font-size="12" text-anchor="middle">03</text>

  <!-- Step Title -->
  <text x="120" y="377" fill="#0F172A" class="font-bold" font-size="15" letter-spacing="-0.01em">步骤 3：并行切分与计算通信重叠流水</text>

  <!-- Step Tag -->
  <rect x="815" y="360" width="215" height="24" rx="6" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="923" y="376.5" fill="#64748B" class="font-mono" font-size="10.5" text-anchor="middle">5D PARALLELISM &amp; OVERLAP</text>

  <!-- Description -->
  <text x="68" y="410" fill="#475569" class="font-regular" font-size="12.5">
    组合正交 5D 并行（DP / ZeRO、TP、SP、PP、EP）；编排双缓冲与异步非阻塞通信图，实现张量通信与底层 GEMM 算子窗口完全掩盖（Zero Bubble）。
  </text>

  <line x1="550" y1="452" x2="550" y2="466" stroke="#CC6644" stroke-width="2.2" stroke-dasharray="3 3"/>
  <polygon points="546,466 554,466 550,471" fill="#CC6644"/>

  <!-- Step 04 -->
  <g filter="url(#shadow-card)">
    <rect x="45" y="470" width="1010" height="106" rx="12" fill="#FFFFFF" stroke="#E5DFD5" stroke-width="1.2"/>
  </g>

  <!-- Number Pill -->
  <rect x="68" y="486" width="40" height="24" rx="6" fill="#FBF5F2" stroke="#CC6644" stroke-width="1"/>
  <text x="88" y="502.5" fill="#CC6644" class="font-mono" font-size="12" text-anchor="middle">04</text>

  <!-- Step Title -->
  <text x="120" y="503" fill="#0F172A" class="font-bold" font-size="15" letter-spacing="-0.01em">步骤 4：容错自愈与高可靠监控运维</text>

  <!-- Step Tag -->
  <rect x="815" y="486" width="215" height="24" rx="6" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="923" y="502.5" fill="#64748B" class="font-mono" font-size="10.5" text-anchor="middle">RESILIENCE &amp; RECOVERY</text>

  <!-- Description -->
  <text x="68" y="536" fill="#475569" class="font-regular" font-size="12.5">
    应用 Daly 公式精准推导最优 Checkpointing 保存周期；部署 In-memory 双副本内存快照、坏卡局部隔离与热备节点秒级自动重映射无损自愈。
  </text>

</svg>