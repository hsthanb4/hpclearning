<?xml version="1.0" encoding="UTF-8"?>
<svg width="1100" height="480" viewBox="0 0 1100 480" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .font-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Inter", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; font-weight: 800; }
      .font-bold { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Inter", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; font-weight: 700; }
      .font-medium { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Inter", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; font-weight: 600; }
      .font-regular { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Inter", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; font-weight: 500; }
      .font-mono { font-family: "JetBrains Mono", Menlo, Monaco, Consolas, monospace; font-weight: 700; }
    </style>
    <filter id="shadow-card" x="-2%" y="-4%" width="104%" height="110%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2.5" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>

  <!-- Background Frame -->
  <rect x="0" y="0" width="1100" height="480" rx="18" fill="#FAF9F5" stroke="#E5DFD5" stroke-width="1.5"/>

  <!-- Top Title Bar -->
  <text x="45" y="46" fill="#0F172A" class="font-title" font-size="20" letter-spacing="-0.02em">SGLang RadixAttention 树形前缀缓存多分支动态复用架构</text>
  <text x="45" y="68" fill="#64748B" class="font-regular" font-size="12.5">把 Prompt 组织成 Radix Tree，多轮对话与 RAG 的公共前缀只做一次 Prefill</text>

  
  <!-- Root Node -->
  <g filter="url(#shadow-card)">
    <rect x="290" y="92" width="520" height="80" rx="12" fill="#FFFFFF" stroke="#CC6644" stroke-width="1.6"/>
  </g>
  <rect x="308" y="106" width="130" height="22" rx="11" fill="#FBF5F2" stroke="#CC6644" stroke-width="0.8"/>
  <text x="373" y="121" fill="#CC6644" class="font-mono" font-size="10.5" text-anchor="middle">ROOT · 共享前缀</text>
  <text x="452" y="122" fill="#0F172A" class="font-bold" font-size="13.5">通用系统提示词 (System Prompt: 2048 Tokens)</text>
  <text x="308" y="152" fill="#475569" class="font-mono" font-size="11">物理显存 Block 0~127: 全局共享常驻，引用计数 Ref = 3</text>

  <!-- Connectors to Branch A and Branch B -->
  <g stroke="#CC6644" stroke-width="2" stroke-dasharray="3 3">
    <line x1="480" y1="172" x2="260" y2="212"/>
    <polygon points="262,207 260,212 266,211" fill="#CC6644"/>

    <line x1="620" y1="172" x2="840" y2="212"/>
    <polygon points="834,211 840,212 838,207" fill="#CC6644"/>
  </g>

  <!-- Child Node A (Doc A) -->
  <g filter="url(#shadow-card)">
    <rect x="45" y="212" width="430" height="84" rx="12" fill="#FFFFFF" stroke="#E5DFD5" stroke-width="1.2"/>
  </g>
  <rect x="65" y="226" width="120" height="22" rx="11" fill="#EFF6FF" stroke="#2563EB" stroke-width="0.8"/>
  <text x="125" y="241" fill="#2563EB" class="font-mono" font-size="10.5" text-anchor="middle">CHILD NODE A</text>
  <text x="195" y="242" fill="#0F172A" class="font-bold" font-size="13">业务知识库文档 A (4096 Tokens)</text>
  <text x="65" y="272" fill="#475569" class="font-mono" font-size="11">显存 Block 128~383 · 引用计数 Ref = 2 · 缓存命中率 95%</text>

  <!-- Child Node B (Doc B) -->
  <g filter="url(#shadow-card)">
    <rect x="625" y="212" width="430" height="84" rx="12" fill="#FFFFFF" stroke="#E5DFD5" stroke-width="1.2"/>
  </g>
  <rect x="645" y="226" width="120" height="22" rx="11" fill="#FDF4FF" stroke="#A855F7" stroke-width="0.8"/>
  <text x="705" y="241" fill="#A855F7" class="font-mono" font-size="10.5" text-anchor="middle">CHILD NODE B</text>
  <text x="775" y="242" fill="#0F172A" class="font-bold" font-size="13">法律检索文档 B (4096 Tokens)</text>
  <text x="645" y="272" fill="#475569" class="font-mono" font-size="11">显存 Block 384~639 · 引用计数 Ref = 1 · 共享根节点缓存</text>

  <!-- Connectors to Leaf Sessions -->
  <g stroke="#94A3B8" stroke-width="2" stroke-dasharray="3 3">
    <line x1="260" y1="296" x2="260" y2="336"/>
    <polygon points="256,331 260,336 264,331" fill="#94A3B8"/>

    <line x1="840" y1="296" x2="840" y2="336"/>
    <polygon points="836,331 840,336 844,331" fill="#94A3B8"/>
  </g>

  <!-- Leaf Session 1 -->
  <g filter="url(#shadow-card)">
    <rect x="45" y="336" width="430" height="88" rx="12" fill="#FFFFFF" stroke="#E5DFD5" stroke-width="1.2"/>
  </g>
  <rect x="65" y="350" width="110" height="22" rx="11" fill="#F0FDF4" stroke="#16A34A" stroke-width="0.8"/>
  <text x="120" y="365" fill="#16A34A" class="font-mono" font-size="10.5" text-anchor="middle">LEAF SESSION 1</text>
  <text x="185" y="366" fill="#0F172A" class="font-bold" font-size="13">会话 1: 用户最新提问 (32 Tokens)</text>
  <text x="65" y="394" fill="#475569" class="font-regular" font-size="11.5">只对 32 个新 Token 做 Prefill；前 6144 Token 的 KV 直接复用</text>

  <!-- Leaf Session 2 -->
  <g filter="url(#shadow-card)">
    <rect x="625" y="336" width="430" height="88" rx="12" fill="#FFFFFF" stroke="#E5DFD5" stroke-width="1.2"/>
  </g>
  <rect x="645" y="350" width="110" height="22" rx="11" fill="#F0FDF4" stroke="#16A34A" stroke-width="0.8"/>
  <text x="700" y="365" fill="#16A34A" class="font-mono" font-size="10.5" text-anchor="middle">LEAF SESSION 2</text>
  <text x="765" y="366" fill="#0F172A" class="font-bold" font-size="13">会话 2: 用户最新提问 (16 Tokens)</text>
  <text x="645" y="394" fill="#475569" class="font-regular" font-size="11.5">只追加 1 个物理 Block；LRU 从叶节点向根逐级淘汰</text>

</svg>