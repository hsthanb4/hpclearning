<?xml version="1.0" encoding="UTF-8"?>
<svg width="1100" height="430" viewBox="0 0 1100 430" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .font-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Inter", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; font-weight: 800; }
      .font-bold { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Inter", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; font-weight: 700; }
      .font-medium { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Inter", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; font-weight: 600; }
      .font-regular { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Inter", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; font-weight: 500; }
      .font-mono { font-family: "JetBrains Mono", Menlo, Monaco, Consolas, monospace; font-weight: 700; }
    </style>
    <filter id="shadow-card" x="-2%" y="-4%" width="104%" height="110%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2.5" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>

  <!-- Background Frame -->
  <rect x="0" y="0" width="1100" height="430" rx="18" fill="#FAF9F5" stroke="#E5DFD5" stroke-width="1.5"/>

  <!-- Top Title Bar -->
  <text x="45" y="46" fill="#0F172A" class="font-title" font-size="20" letter-spacing="-0.02em">具身智能模型持续演进的三阶安全发布门禁</text>
  <text x="45" y="68" fill="#64748B" class="font-regular" font-size="12.5">从云端高保真仿真基准、车端 72 小时无损静默影子推演到金丝雀渐进式 OTA 发布闭环</text>

  
  <!-- Gate 1 -->
  <g filter="url(#shadow-card)">
    <rect x="45" y="92" width="1010" height="88" rx="12" fill="#FFFFFF" stroke="#E5DFD5" stroke-width="1.2"/>
  </g>
  <rect x="68" y="108" width="36" height="22" rx="5" fill="#FBF5F2" stroke="#CC6644" stroke-width="1"/>
  <text x="86" y="123" fill="#CC6644" class="font-mono" font-size="11.5" text-anchor="middle">01</text>
  <text x="116" y="124" fill="#0F172A" class="font-bold" font-size="15">阶段 1：云端物理仿真全量回归</text>

  <rect x="770" y="108" width="260" height="22" rx="5" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="900" y="123" fill="#64748B" class="font-mono" font-size="9.5" text-anchor="middle">ISAAC LAB REGRESSION &gt;= 99.5%</text>

  <text x="68" y="154" fill="#475569" class="font-regular" font-size="12">
    在 GPU 仿真集群并行运行 1,000 项极端标准工况任务；测试碰撞率、轨迹规划成功率与运动平滑度指标。
  </text>

  <line x1="550" y1="182" x2="550" y2="196" stroke="#CC6644" stroke-width="2.2" stroke-dasharray="3 3"/>
  <polygon points="546,196 554,196 550,201" fill="#CC6644"/>

  <!-- Gate 2 -->
  <g filter="url(#shadow-card)">
    <rect x="45" y="200" width="1010" height="88" rx="12" fill="#FFFFFF" stroke="#E5DFD5" stroke-width="1.2"/>
  </g>
  <rect x="68" y="216" width="36" height="22" rx="5" fill="#FBF5F2" stroke="#CC6644" stroke-width="1"/>
  <text x="86" y="231" fill="#CC6644" class="font-mono" font-size="11.5" text-anchor="middle">02</text>
  <text x="116" y="232" fill="#0F172A" class="font-bold" font-size="15">阶段 2：车队静默影子模式验证</text>

  <rect x="770" y="216" width="260" height="22" rx="5" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="900" y="231" fill="#64748B" class="font-mono" font-size="9.5" text-anchor="middle">SHADOW MODE 72H ZERO-FAULT</text>

  <text x="68" y="262" fill="#475569" class="font-regular" font-size="12">
    在 10,000 台真实机器人机载端侧后台只读运行；实时对比预测轨迹与人类/基线策略分歧度，不向电机下发力矩。
  </text>

  <line x1="550" y1="290" x2="550" y2="304" stroke="#CC6644" stroke-width="2.2" stroke-dasharray="3 3"/>
  <polygon points="546,304 554,304 550,309" fill="#CC6644"/>

  <!-- Gate 3 -->
  <g filter="url(#shadow-card)">
    <rect x="45" y="308" width="1010" height="88" rx="12" fill="#FFFFFF" stroke="#E5DFD5" stroke-width="1.2"/>
  </g>
  <rect x="68" y="324" width="36" height="22" rx="5" fill="#FBF5F2" stroke="#CC6644" stroke-width="1"/>
  <text x="86" y="339" fill="#CC6644" class="font-mono" font-size="11.5" text-anchor="middle">03</text>
  <text x="116" y="340" fill="#0F172A" class="font-bold" font-size="15">阶段 3：金丝雀渐进式差分 OTA</text>

  <rect x="770" y="324" width="260" height="22" rx="5" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="900" y="339" fill="#64748B" class="font-mono" font-size="9.5" text-anchor="middle">1% -&gt; 10% -&gt; 100% CANARY ROLLOUT</text>

  <text x="68" y="370" fill="#475569" class="font-regular" font-size="12">
    分批次安全烧录激活电机控制回路；部署微秒级异常急停回退熔断机制，达成整套具身数据飞轮的安全闭环。
  </text>

</svg>