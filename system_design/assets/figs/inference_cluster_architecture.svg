<?xml version="1.0" encoding="UTF-8"?>
<svg width="1100" height="550" viewBox="0 0 1100 550" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .font-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Inter", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; font-weight: 800; }
      .font-bold { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Inter", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; font-weight: 700; }
      .font-medium { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Inter", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; font-weight: 600; }
      .font-regular { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Inter", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; font-weight: 500; }
      .font-mono { font-family: "JetBrains Mono", Menlo, Monaco, Consolas, monospace; font-weight: 700; }
    </style>
    <filter id="shadow-card" x="-2%" y="-4%" width="104%" height="110%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2.5" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>

  <!-- Background Frame -->
  <rect x="0" y="0" width="1100" height="550" rx="18" fill="#FAF9F5" stroke="#E5DFD5" stroke-width="1.5"/>

  <!-- Top Title Bar -->
  <text x="45" y="46" fill="#0F172A" class="font-title" font-size="20" letter-spacing="-0.02em">高并发低时延分布式 LLM / VLA 推理服务集群设计</text>
  <text x="45" y="68" fill="#64748B" class="font-regular" font-size="12.5">PD 物理分离架构、RDMA 零拷贝 KV 传输、RadixTree 树形前缀复用与具身双频流式调度</text>

  
  <!-- Stage 1 -->
  <g filter="url(#shadow-card)">
    <rect x="45" y="88" width="1010" height="92" rx="12" fill="#FFFFFF" stroke="#E5DFD5" stroke-width="1.2"/>
  </g>
  <rect x="68" y="103" width="80" height="22" rx="5" fill="#FBF5F2" stroke="#CC6644" stroke-width="1"/>
  <text x="108" y="118" fill="#CC6644" class="font-mono" font-size="11" text-anchor="middle">STAGE 01</text>
  <text x="160" y="119" fill="#0F172A" class="font-bold" font-size="14.5">智能动态路由网关层 (Dynamic Routing &amp; Dispatcher)</text>

  <rect x="810" y="103" width="220" height="22" rx="5" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="920" y="118" fill="#64748B" class="font-mono" font-size="9.5" text-anchor="middle">GATEWAY &amp; PREFIX-AWARE</text>

  <text x="68" y="148" fill="#475569" class="font-regular" font-size="12">
    全球 HTTP/gRPC 对话请求与具身机器人 Zenoh 高频遥测接入；前缀感知路由器（Prefix-Aware Router）结合全局 RadixTree 缓存元数据索引，最大化 KV Cache 命中率。
  </text>

  <line x1="550" y1="182" x2="550" y2="192" stroke="#CC6644" stroke-width="2" stroke-dasharray="3 3"/>
  <polygon points="546,192 554,192 550,196" fill="#CC6644"/>

  <!-- Stage 2 -->
  <g filter="url(#shadow-card)">
    <rect x="45" y="196" width="1010" height="92" rx="12" fill="#FFFFFF" stroke="#E5DFD5" stroke-width="1.2"/>
  </g>
  <rect x="68" y="211" width="80" height="22" rx="5" fill="#FBF5F2" stroke="#CC6644" stroke-width="1"/>
  <text x="108" y="226" fill="#CC6644" class="font-mono" font-size="11" text-anchor="middle">STAGE 02</text>
  <text x="160" y="227" fill="#0F172A" class="font-bold" font-size="14.5">Prefill 算力池 (计算密集型: H100 SXM, TP=4)</text>

  <rect x="810" y="211" width="220" height="22" rx="5" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="920" y="226" fill="#64748B" class="font-mono" font-size="9.5" text-anchor="middle">COMPUTE-BOUND POOL</text>

  <text x="68" y="256" fill="#475569" class="font-regular" font-size="12">
    聚焦 Prompt 长文本并行处理；采用 Chunked Prefill 动态配平长短序列，以超大 GEMM 算子打满 Tensor Core 算力峰值（算术强度高）。
  </text>

  <line x1="550" y1="290" x2="550" y2="300" stroke="#CC6644" stroke-width="2" stroke-dasharray="3 3"/>
  <polygon points="546,300 554,300 550,304" fill="#CC6644"/>

  <!-- Stage 3 -->
  <g filter="url(#shadow-card)">
    <rect x="45" y="304" width="1010" height="92" rx="12" fill="#FFFFFF" stroke="#E5DFD5" stroke-width="1.2"/>
  </g>
  <rect x="68" y="319" width="80" height="22" rx="5" fill="#FBF5F2" stroke="#CC6644" stroke-width="1"/>
  <text x="108" y="334" fill="#CC6644" class="font-mono" font-size="11" text-anchor="middle">STAGE 03</text>
  <text x="160" y="335" fill="#0F172A" class="font-bold" font-size="14.5">跨节点 GPUDirect RDMA 零拷贝 KV Cache 迁移总线</text>

  <rect x="810" y="319" width="220" height="22" rx="5" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="920" y="334" fill="#64748B" class="font-mono" font-size="9.5" text-anchor="middle">400GBPS MEMORY-TO-MEMORY BUS</text>

  <text x="68" y="364" fill="#475569" class="font-regular" font-size="12">
    Prefill 产出的 KV Cache 绕过 CPU 内存，通过 400Gbps RDMA 直接以 DMA 事务压入目标 Decode 卡显存（迁移耗时 &lt; 10ms，彻底消除排队队头阻塞）。
  </text>

  <line x1="550" y1="398" x2="550" y2="408" stroke="#CC6644" stroke-width="2" stroke-dasharray="3 3"/>
  <polygon points="546,408 554,408 550,412" fill="#CC6644"/>

  <!-- Stage 4 -->
  <g filter="url(#shadow-card)">
    <rect x="45" y="412" width="1010" height="92" rx="12" fill="#FFFFFF" stroke="#E5DFD5" stroke-width="1.2"/>
  </g>
  <rect x="68" y="427" width="80" height="22" rx="5" fill="#FBF5F2" stroke="#CC6644" stroke-width="1"/>
  <text x="108" y="442" fill="#CC6644" class="font-mono" font-size="11" text-anchor="middle">STAGE 04</text>
  <text x="160" y="443" fill="#0F172A" class="font-bold" font-size="14.5">Decode 算力池与具身端侧双频引擎 (L40S / H100)</text>

  <rect x="810" y="427" width="220" height="22" rx="5" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="920" y="442" fill="#64748B" class="font-mono" font-size="9.5" text-anchor="middle">MEMORY-BOUND POOL &amp; ROBOT EDGE</text>

  <text x="68" y="472" fill="#475569" class="font-regular" font-size="12">
    Continuous Batching + PagedAttention 显存碎片受限管理；端侧 10Hz VLM 静态语义特征固化与 100Hz 动作去噪求解器双缓冲滚动时域无缝衔接。
  </text>

</svg>