<?xml version="1.0" encoding="UTF-8"?>
<svg width="1100" height="520" viewBox="0 0 1100 520" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .font-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Inter", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; font-weight: 800; }
      .font-bold { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Inter", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; font-weight: 700; }
      .font-medium { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Inter", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; font-weight: 600; }
      .font-regular { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Inter", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; font-weight: 500; }
      .font-mono { font-family: "JetBrains Mono", Menlo, Monaco, Consolas, monospace; font-weight: 700; }
    </style>
    <filter id="shadow-card" x="-2%" y="-4%" width="104%" height="110%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2.5" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>

  <!-- Background Frame -->
  <rect x="0" y="0" width="1100" height="520" rx="18" fill="#FAF9F5" stroke="#E5DFD5" stroke-width="1.5"/>

  <!-- Top Title Bar -->
  <text x="45" y="46" fill="#0F172A" class="font-title" font-size="20" letter-spacing="-0.02em">8 导轨对齐物理网络架构 (Rail-Optimized Architecture)</text>
  <text x="45" y="68" fill="#64748B" class="font-regular" font-size="12.5">相同序号 GPU 跨节点接入专属独立导轨平面，0 跨导轨流量冲突，保障万卡集合通信线速</text>

  
  <!-- Spine Switches Layer -->
  <g filter="url(#shadow-card)">
    <rect x="45" y="92" width="1010" height="96" rx="14" fill="#FFFFFF" stroke="#E5DFD5" stroke-width="1.2"/>
  </g>
  <rect x="68" y="106" width="145" height="22" rx="11" fill="#FBF5F2" stroke="#CC6644" stroke-width="0.8"/>
  <text x="140" y="121" fill="#CC6644" class="font-mono" font-size="10.5" text-anchor="middle">SPINE LAYER</text>
  <text x="225" y="122" fill="#0F172A" class="font-bold" font-size="14">核心交换机层 (Spine Switches: 8 个独立导轨平面)</text>

  <g transform="translate(68, 138)">

    <rect x="0" y="0" width="112" height="36" rx="7" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
    <text x="56" y="22" fill="#1E293B" class="font-mono" font-size="11.5" text-anchor="middle">Spine Rail 0</text>

    <rect x="122" y="0" width="112" height="36" rx="7" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
    <text x="178" y="22" fill="#1E293B" class="font-mono" font-size="11.5" text-anchor="middle">Spine Rail 1</text>

    <rect x="244" y="0" width="112" height="36" rx="7" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
    <text x="300" y="22" fill="#1E293B" class="font-mono" font-size="11.5" text-anchor="middle">Spine Rail 2</text>

    <rect x="366" y="0" width="112" height="36" rx="7" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
    <text x="422" y="22" fill="#1E293B" class="font-mono" font-size="11.5" text-anchor="middle">Spine Rail 3</text>

    <rect x="488" y="0" width="112" height="36" rx="7" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
    <text x="544" y="22" fill="#1E293B" class="font-mono" font-size="11.5" text-anchor="middle">Spine Rail 4</text>

    <rect x="610" y="0" width="112" height="36" rx="7" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
    <text x="666" y="22" fill="#1E293B" class="font-mono" font-size="11.5" text-anchor="middle">Spine Rail 5</text>

    <rect x="732" y="0" width="112" height="36" rx="7" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
    <text x="788" y="22" fill="#1E293B" class="font-mono" font-size="11.5" text-anchor="middle">Spine Rail 6</text>

    <rect x="854" y="0" width="112" height="36" rx="7" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
    <text x="910" y="22" fill="#1E293B" class="font-mono" font-size="11.5" text-anchor="middle">Spine Rail 7</text>
  </g>

  <!-- Connectors Spine -> Leaf -->
  <g stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="2 2">
    <line x1="124" y1="188" x2="124" y2="218"/>
    <line x1="246" y1="188" x2="246" y2="218"/>
    <line x1="490" y1="188" x2="490" y2="218"/>
    <line x1="734" y1="188" x2="734" y2="218"/>
    <line x1="978" y1="188" x2="978" y2="218"/>
  </g>

  <!-- Leaf Switches Layer -->
  <g filter="url(#shadow-card)">
    <rect x="45" y="218" width="1010" height="96" rx="14" fill="#FFFFFF" stroke="#E5DFD5" stroke-width="1.2"/>
  </g>
  <rect x="68" y="232" width="145" height="22" rx="11" fill="#EFF6FF" stroke="#2563EB" stroke-width="0.8"/>
  <text x="140" y="247" fill="#2563EB" class="font-mono" font-size="10.5" text-anchor="middle">LEAF / TOR LAYER</text>
  <text x="225" y="248" fill="#0F172A" class="font-bold" font-size="14">叶子交换机层 (TOR Switches: 相同导轨 GPU 直连汇聚)</text>

  <g transform="translate(68, 264)">

    <rect x="0" y="0" width="112" height="36" rx="7" fill="#F8FAFC" stroke="#BFDBFE" stroke-width="1"/>
    <text x="56" y="22" fill="#1E40AF" class="font-mono" font-size="11.5" text-anchor="middle">Leaf Rail 0 组</text>

    <rect x="122" y="0" width="112" height="36" rx="7" fill="#F8FAFC" stroke="#BFDBFE" stroke-width="1"/>
    <text x="178" y="22" fill="#1E40AF" class="font-mono" font-size="11.5" text-anchor="middle">Leaf Rail 1 组</text>

    <rect x="244" y="0" width="112" height="36" rx="7" fill="#F8FAFC" stroke="#BFDBFE" stroke-width="1"/>
    <text x="300" y="22" fill="#1E40AF" class="font-mono" font-size="11.5" text-anchor="middle">Leaf Rail 2 组</text>

    <rect x="366" y="0" width="112" height="36" rx="7" fill="#F8FAFC" stroke="#BFDBFE" stroke-width="1"/>
    <text x="422" y="22" fill="#1E40AF" class="font-mono" font-size="11.5" text-anchor="middle">Leaf Rail 3 组</text>

    <rect x="488" y="0" width="112" height="36" rx="7" fill="#F8FAFC" stroke="#BFDBFE" stroke-width="1"/>
    <text x="544" y="22" fill="#1E40AF" class="font-mono" font-size="11.5" text-anchor="middle">Leaf Rail 4 组</text>

    <rect x="610" y="0" width="112" height="36" rx="7" fill="#F8FAFC" stroke="#BFDBFE" stroke-width="1"/>
    <text x="666" y="22" fill="#1E40AF" class="font-mono" font-size="11.5" text-anchor="middle">Leaf Rail 5 组</text>

    <rect x="732" y="0" width="112" height="36" rx="7" fill="#F8FAFC" stroke="#BFDBFE" stroke-width="1"/>
    <text x="788" y="22" fill="#1E40AF" class="font-mono" font-size="11.5" text-anchor="middle">Leaf Rail 6 组</text>

    <rect x="854" y="0" width="112" height="36" rx="7" fill="#F8FAFC" stroke="#BFDBFE" stroke-width="1"/>
    <text x="910" y="22" fill="#1E40AF" class="font-mono" font-size="11.5" text-anchor="middle">Leaf Rail 7 组</text>
  </g>

  <!-- Connectors Leaf -> Compute Nodes -->
  <g stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="2 2">
    <line x1="124" y1="314" x2="124" y2="344"/>
    <line x1="246" y1="314" x2="246" y2="344"/>
    <line x1="490" y1="314" x2="490" y2="344"/>
    <line x1="734" y1="314" x2="734" y2="344"/>
    <line x1="978" y1="314" x2="978" y2="344"/>
  </g>

  <!-- Compute Nodes Cluster Layer -->
  <g filter="url(#shadow-card)">
    <rect x="45" y="344" width="1010" height="142" rx="14" fill="#FFFFFF" stroke="#E5DFD5" stroke-width="1.2"/>
  </g>
  <rect x="68" y="358" width="155" height="22" rx="11" fill="#F0FDF4" stroke="#16A34A" stroke-width="0.8"/>
  <text x="145" y="373" fill="#16A34A" class="font-mono" font-size="10.5" text-anchor="middle">COMPUTE CLUSTER</text>
  <text x="235" y="374" fill="#0F172A" class="font-bold" font-size="14">计算节点群 (512 台 8 卡 H800 节点，每卡独占 1 个独立导轨网卡 NIC 0~7)</text>

  <!-- Two Sample Nodes -->
  <g transform="translate(68, 390)">
    <!-- Node 0 -->
    <rect x="0" y="0" width="460" height="80" rx="9" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
    <text x="16" y="24" fill="#0F172A" class="font-bold" font-size="12">Node 0 (机内全互联 NVLink 900GB/s 域)</text>
    <g transform="translate(16, 36)">
      <rect x="0" y="0" width="98" height="30" rx="6" fill="#FBF5F2" stroke="#CC6644" stroke-width="0.8"/>
      <text x="49" y="19" fill="#8C4325" class="font-mono" font-size="10.5" text-anchor="middle">GPU 0 (NIC 0)</text>
      
      <rect x="110" y="0" width="98" height="30" rx="6" fill="#EFF6FF" stroke="#2563EB" stroke-width="0.8"/>
      <text x="159" y="19" fill="#1E40AF" class="font-mono" font-size="10.5" text-anchor="middle">GPU 1 (NIC 1)</text>

      <text x="240" y="19" fill="#94A3B8" class="font-bold" font-size="12">···</text>

      <rect x="270" y="0" width="98" height="30" rx="6" fill="#F3E8FF" stroke="#7C3AED" stroke-width="0.8"/>
      <text x="319" y="19" fill="#581C87" class="font-mono" font-size="10.5" text-anchor="middle">GPU 7 (NIC 7)</text>
    </g>

    <!-- Node 1 -->
    <rect x="496" y="0" width="460" height="80" rx="9" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
    <text x="512" y="24" fill="#0F172A" class="font-bold" font-size="12">Node 1 (所有节点的 GPU i 严格接入同一个导轨 Rail i)</text>
    <g transform="translate(512, 36)">
      <rect x="0" y="0" width="98" height="30" rx="6" fill="#FBF5F2" stroke="#CC6644" stroke-width="0.8"/>
      <text x="49" y="19" fill="#8C4325" class="font-mono" font-size="10.5" text-anchor="middle">GPU 0 (NIC 0)</text>
      
      <rect x="110" y="0" width="98" height="30" rx="6" fill="#EFF6FF" stroke="#2563EB" stroke-width="0.8"/>
      <text x="159" y="19" fill="#1E40AF" class="font-mono" font-size="10.5" text-anchor="middle">GPU 1 (NIC 1)</text>

      <text x="240" y="19" fill="#94A3B8" class="font-bold" font-size="12">···</text>

      <rect x="270" y="0" width="98" height="30" rx="6" fill="#F3E8FF" stroke="#7C3AED" stroke-width="0.8"/>
      <text x="319" y="19" fill="#581C87" class="font-mono" font-size="10.5" text-anchor="middle">GPU 7 (NIC 7)</text>
    </g>
  </g>

</svg>