<?xml version="1.0" encoding="UTF-8"?>
<svg width="1100" height="550" viewBox="0 0 1100 550" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .font-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Inter", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; font-weight: 800; }
      .font-bold { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Inter", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; font-weight: 700; }
      .font-medium { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Inter", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; font-weight: 600; }
      .font-regular { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Inter", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; font-weight: 500; }
      .font-mono { font-family: "JetBrains Mono", Menlo, Monaco, Consolas, monospace; font-weight: 700; }
    </style>
    <filter id="shadow-card" x="-2%" y="-4%" width="104%" height="110%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2.5" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>

  <!-- Background Frame -->
  <rect x="0" y="0" width="1100" height="550" rx="18" fill="#FAF9F5" stroke="#E5DFD5" stroke-width="1.5"/>

  <!-- Top Title Bar -->
  <text x="45" y="46" fill="#0F172A" class="font-title" font-size="20" letter-spacing="-0.02em">万卡千亿/万亿 MoE 超大规模预训练平台整体架构全景</text>
  <text x="45" y="68" fill="#64748B" class="font-regular" font-size="12.5">4096 卡 H800 集群架构、8-Rail 导轨对齐、DeepEP 节点限制通信与 Daly 容错体系</text>

  
  <!-- Layer 1 -->
  <g filter="url(#shadow-card)">
    <rect x="45" y="92" width="1010" height="112" rx="14" fill="#FFFFFF" stroke="#E5DFD5" stroke-width="1.2"/>
  </g>
  <rect x="68" y="108" width="80" height="24" rx="6" fill="#FBF5F2" stroke="#CC6644" stroke-width="1"/>
  <text x="108" y="124.5" fill="#CC6644" class="font-mono" font-size="11" text-anchor="middle">LAYER 01</text>
  <text x="160" y="125" fill="#0F172A" class="font-bold" font-size="15">硬件与网络基础设施层 (Rail-Optimized Spine-Leaf)</text>

  <rect x="815" y="108" width="215" height="24" rx="6" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="923" y="124.5" fill="#64748B" class="font-mono" font-size="10" text-anchor="middle">HARDWARE INFRASTRUCTURE</text>

  <text x="68" y="160" fill="#475569" class="font-regular" font-size="12.5" line-height="1.6">
    512 台 8 卡 H800 节点（NVLink 900GB/s 域）；8-Rail 独立导轨无损 RoCE/IB 网络（每卡独占 400Gbps NIC，0 跨导轨冲突）；GPUDirect Storage 零拷贝并行存储。
  </text>

  <line x1="550" y1="207" x2="550" y2="223" stroke="#CC6644" stroke-width="2.2" stroke-dasharray="3 3"/>
  <polygon points="546,223 554,223 550,228" fill="#CC6644"/>

  <!-- Layer 2 -->
  <g filter="url(#shadow-card)">
    <rect x="45" y="228" width="1010" height="112" rx="14" fill="#FFFFFF" stroke="#E5DFD5" stroke-width="1.2"/>
  </g>
  <rect x="68" y="244" width="80" height="24" rx="6" fill="#FBF5F2" stroke="#CC6644" stroke-width="1"/>
  <text x="108" y="260.5" fill="#CC6644" class="font-mono" font-size="11" text-anchor="middle">LAYER 02</text>
  <text x="160" y="261" fill="#0F172A" class="font-bold" font-size="15">5D 混合并行与通信隐藏编排拓扑</text>

  <rect x="815" y="244" width="215" height="24" rx="6" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="923" y="260.5" fill="#64748B" class="font-mono" font-size="10" text-anchor="middle">PARALLELISM TOPOLOGY</text>

  <text x="68" y="296" fill="#475569" class="font-regular" font-size="12.5" line-height="1.6">
    PP=16（Dual-Pipe 双向流水）× EP=64（专家分布在 8 个节点）× DP=4（ZeRO-1 分片优化器）；DeepEP 用专用 SM 掩盖 All-to-All。
  </text>

  <line x1="550" y1="343" x2="550" y2="359" stroke="#CC6644" stroke-width="2.2" stroke-dasharray="3 3"/>
  <polygon points="546,359 554,359 550,364" fill="#CC6644"/>

  <!-- Layer 3 -->
  <g filter="url(#shadow-card)">
    <rect x="45" y="364" width="1010" height="112" rx="14" fill="#FFFFFF" stroke="#E5DFD5" stroke-width="1.2"/>
  </g>
  <rect x="68" y="380" width="80" height="24" rx="6" fill="#FBF5F2" stroke="#CC6644" stroke-width="1"/>
  <text x="108" y="396.5" fill="#CC6644" class="font-mono" font-size="11" text-anchor="middle">LAYER 03</text>
  <text x="160" y="397" fill="#0F172A" class="font-bold" font-size="15">万卡级高可靠容错自愈与监控度量</text>

  <rect x="815" y="380" width="215" height="24" rx="6" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
  <text x="923" y="396.5" fill="#64748B" class="font-mono" font-size="10" text-anchor="middle">RESILIENCE &amp; RECOVERY</text>

  <text x="68" y="432" fill="#475569" class="font-regular" font-size="12.5" line-height="1.6">
    Daly 模型给出最优快照周期 Tau* ≈ 60 分钟；In-Memory 双副本异步落盘，不阻塞计算；2% 热备节点动态重映射 Rank，60 s 内恢复。
  </text>

</svg>