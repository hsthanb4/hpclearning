<?xml version="1.0" encoding="UTF-8"?>
<svg width="1170" height="450" viewBox="0 0 1170 450" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .font-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Inter", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; font-weight: 800; }
      .font-bold { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Inter", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; font-weight: 700; }
      .font-medium { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Inter", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; font-weight: 600; }
      .font-regular { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Inter", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; font-weight: 500; }
      .font-mono { font-family: "JetBrains Mono", Menlo, Monaco, Consolas, monospace; font-weight: 700; }
    </style>
    <filter id="shadow-card" x="-2%" y="-4%" width="104%" height="110%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2.5" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>

  <!-- Background Frame -->
  <rect x="0" y="0" width="1170" height="450" rx="18" fill="#FAF9F5" stroke="#E5DFD5" stroke-width="1.5"/>

  <!-- Top Title Bar -->
  <text x="45" y="46" fill="#0F172A" class="font-title" font-size="20" letter-spacing="-0.02em">AI Infra 六大核心量化推导支柱全景</text>
  <text x="45" y="68" fill="#64748B" class="font-regular" font-size="12.5">涵盖显存账本、通信量、利用率、KV Cache、Roofline 拐点与流水线气泡的一站式速查体系</text>

  
  <!-- Pillar 01 -->
  <g filter="url(#shadow-card)">
    <rect x="45" y="92" width="346" height="152" rx="12" fill="#FFFFFF" stroke="#E5DFD5" stroke-width="1.2"/>
  </g>
  <rect x="61" y="106" width="28" height="20" rx="5" fill="#FBF5F2" stroke="#CC6644" stroke-width="0.8"/>
  <text x="75" y="120" fill="#CC6644" class="font-mono" font-size="10.5" text-anchor="middle">01</text>
  <text x="97" y="120.5" fill="#0F172A" class="font-bold" font-size="13.5">大模型显存账本</text>
  
  <rect x="286" y="106" width="89" height="20" rx="5" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="0.8"/>
  <text x="331" y="120" fill="#64748B" class="font-mono" font-size="8.5" text-anchor="middle">MEMORY</text>

  <!-- Formula Highlight Box -->
  <rect x="61" y="136" width="314" height="32" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="0.8"/>
  <text x="218" y="156" fill="#2563EB" class="font-mono" font-size="9.4" text-anchor="middle">M_static = 16Φ (FP16) | M_act ~ L·s·b·h(34 + 5as/h)</text>

  <!-- Description Two Lines -->
  <text x="61" y="190" fill="#475569" class="font-regular" font-size="11">
    静态四支柱（参数 2Φ、梯度 2Φ、优化器 12Φ）与动态激活；
  </text>
  <text x="61" y="208" fill="#475569" class="font-regular" font-size="11">
    ZeRO-1/2/3 显存切分阶梯，按需动态重构消除状态冗余。
  </text>

  <!-- Pillar 02 -->
  <g filter="url(#shadow-card)">
    <rect x="411" y="92" width="346" height="152" rx="12" fill="#FFFFFF" stroke="#E5DFD5" stroke-width="1.2"/>
  </g>
  <rect x="427" y="106" width="28" height="20" rx="5" fill="#FBF5F2" stroke="#CC6644" stroke-width="0.8"/>
  <text x="441" y="120" fill="#CC6644" class="font-mono" font-size="10.5" text-anchor="middle">02</text>
  <text x="463" y="120.5" fill="#0F172A" class="font-bold" font-size="13.5">分布式通信量模型</text>
  
  <rect x="652" y="106" width="89" height="20" rx="5" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="0.8"/>
  <text x="697" y="120" fill="#64748B" class="font-mono" font-size="8.5" text-anchor="middle">COMMUNICATION</text>

  <!-- Formula Highlight Box -->
  <rect x="427" y="136" width="314" height="32" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="0.8"/>
  <text x="584" y="156" fill="#2563EB" class="font-mono" font-size="9.4" text-anchor="middle">V_AllReduce = 2·(p-1)/p · K ≈ 2K | V_All2All = (p-1)/p · K</text>

  <!-- Description Two Lines -->
  <text x="427" y="190" fill="#475569" class="font-regular" font-size="11">
    Ring / Tree 算法延迟与带宽模型，跳数与跨节点延迟约束；
  </text>
  <text x="427" y="208" fill="#475569" class="font-regular" font-size="11">
    Megatron-SP 序列切分共轭对原语闭环通信量严格守恒。
  </text>

  <!-- Pillar 03 -->
  <g filter="url(#shadow-card)">
    <rect x="777" y="92" width="346" height="152" rx="12" fill="#FFFFFF" stroke="#E5DFD5" stroke-width="1.2"/>
  </g>
  <rect x="793" y="106" width="28" height="20" rx="5" fill="#FBF5F2" stroke="#CC6644" stroke-width="0.8"/>
  <text x="807" y="120" fill="#CC6644" class="font-mono" font-size="10.5" text-anchor="middle">03</text>
  <text x="829" y="120.5" fill="#0F172A" class="font-bold" font-size="13.5">算力利用率精算</text>
  
  <rect x="1018" y="106" width="89" height="20" rx="5" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="0.8"/>
  <text x="1063" y="120" fill="#64748B" class="font-mono" font-size="8.5" text-anchor="middle">UTILIZATION</text>

  <!-- Formula Highlight Box -->
  <rect x="793" y="136" width="314" height="32" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="0.8"/>
  <text x="950" y="156" fill="#2563EB" class="font-mono" font-size="9.4" text-anchor="middle">FLOPs = 6·P·T | MFU = 6PT / (T_step · N_gpu · Peak_TFLOPS)</text>

  <!-- Description Two Lines -->
  <text x="793" y="190" fill="#475569" class="font-regular" font-size="11">
    前向 2PT + 反向 4PT 算力法则，单步理论必需计算量；
  </text>
  <text x="793" y="208" fill="#475569" class="font-regular" font-size="11">
    剔除重计算虚假浮点的真实 MFU，拒绝高 HFU 低 MFU 陷阱。
  </text>

  <!-- Pillar 04 -->
  <g filter="url(#shadow-card)">
    <rect x="45" y="264" width="346" height="152" rx="12" fill="#FFFFFF" stroke="#E5DFD5" stroke-width="1.2"/>
  </g>
  <rect x="61" y="278" width="28" height="20" rx="5" fill="#FBF5F2" stroke="#CC6644" stroke-width="0.8"/>
  <text x="75" y="292" fill="#CC6644" class="font-mono" font-size="10.5" text-anchor="middle">04</text>
  <text x="97" y="292.5" fill="#0F172A" class="font-bold" font-size="13.5">推理与 KV Cache 容量</text>
  
  <rect x="286" y="278" width="89" height="20" rx="5" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="0.8"/>
  <text x="331" y="292" fill="#64748B" class="font-mono" font-size="8.5" text-anchor="middle">KV CACHE</text>

  <!-- Formula Highlight Box -->
  <rect x="61" y="308" width="314" height="32" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="0.8"/>
  <text x="218" y="328" fill="#2563EB" class="font-mono" font-size="9.4" text-anchor="middle">M_kv = 2 · 2 · n_layers · n_kv_heads · d_head · b · s</text>

  <!-- Description Two Lines -->
  <text x="61" y="362" fill="#475569" class="font-regular" font-size="11">
    Prefill 算力受限（Compute-bound）vs Decode 访存受限；
  </text>
  <text x="61" y="380" fill="#475569" class="font-regular" font-size="11">
    PagedAttention 显存虚拟分页管理与 RadixTree 前缀复用。
  </text>

  <!-- Pillar 05 -->
  <g filter="url(#shadow-card)">
    <rect x="411" y="264" width="346" height="152" rx="12" fill="#FFFFFF" stroke="#E5DFD5" stroke-width="1.2"/>
  </g>
  <rect x="427" y="278" width="28" height="20" rx="5" fill="#FBF5F2" stroke="#CC6644" stroke-width="0.8"/>
  <text x="441" y="292" fill="#CC6644" class="font-mono" font-size="10.5" text-anchor="middle">05</text>
  <text x="463" y="292.5" fill="#0F172A" class="font-bold" font-size="13.5">硬件微架构 Roofline</text>
  
  <rect x="652" y="278" width="89" height="20" rx="5" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="0.8"/>
  <text x="697" y="292" fill="#64748B" class="font-mono" font-size="8.5" text-anchor="middle">ROOFLINE</text>

  <!-- Formula Highlight Box -->
  <rect x="427" y="308" width="314" height="32" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="0.8"/>
  <text x="584" y="328" fill="#2563EB" class="font-mono" font-size="9.4" text-anchor="middle">AI* = Peak_FLOPS / Peak_BW | A100: 153 | H100: 295 FLOP/B</text>

  <!-- Description Two Lines -->
  <text x="427" y="362" fill="#475569" class="font-regular" font-size="11">
    算术强度与硬件平衡拐点判定，定位算子物理瓶颈；
  </text>
  <text x="427" y="380" fill="#475569" class="font-regular" font-size="11">
    低于拐点做算子融合与访存合并，高于拐点打满 Tensor Core。
  </text>

  <!-- Pillar 06 -->
  <g filter="url(#shadow-card)">
    <rect x="777" y="264" width="346" height="152" rx="12" fill="#FFFFFF" stroke="#E5DFD5" stroke-width="1.2"/>
  </g>
  <rect x="793" y="278" width="28" height="20" rx="5" fill="#FBF5F2" stroke="#CC6644" stroke-width="0.8"/>
  <text x="807" y="292" fill="#CC6644" class="font-mono" font-size="10.5" text-anchor="middle">06</text>
  <text x="829" y="292.5" fill="#0F172A" class="font-bold" font-size="13.5">流水线调度与气泡率</text>
  
  <rect x="1018" y="278" width="89" height="20" rx="5" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="0.8"/>
  <text x="1063" y="292" fill="#64748B" class="font-mono" font-size="8.5" text-anchor="middle">PIPELINE</text>

  <!-- Formula Highlight Box -->
  <rect x="793" y="308" width="314" height="32" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="0.8"/>
  <text x="950" y="328" fill="#2563EB" class="font-mono" font-size="9.4" text-anchor="middle">r_bubble = (p - 1) / m | Interleaved 1F1B: (p - 1) / (v · m)</text>

  <!-- Description Two Lines -->
  <text x="793" y="362" fill="#475569" class="font-regular" font-size="11">
    1F1B 稳态单卡驻留激活峰值强力截断至 O(p)；
  </text>
  <text x="793" y="380" fill="#475569" class="font-regular" font-size="11">
    交织分片压制气泡，非均质多频调度消除首尾异构瓶颈。
  </text>

</svg>