<?xml version="1.0" encoding="UTF-8"?>
<svg width="1100" height="480" viewBox="0 0 1100 480" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .font-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Inter", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; font-weight: 800; }
      .font-bold { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Inter", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; font-weight: 700; }
      .font-medium { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Inter", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; font-weight: 600; }
      .font-regular { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Inter", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; font-weight: 500; }
      .font-mono { font-family: "JetBrains Mono", Menlo, Monaco, Consolas, monospace; font-weight: 700; }
    </style>
    <filter id="shadow-card" x="-2%" y="-4%" width="104%" height="110%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2.5" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.04"/>
    </filter>
  </defs>

  <!-- Background Frame -->
  <rect x="0" y="0" width="1100" height="480" rx="18" fill="#FAF9F5" stroke="#E5DFD5" stroke-width="1.5"/>

  <!-- Top Title Bar -->
  <text x="45" y="46" fill="#0F172A" class="font-title" font-size="20" letter-spacing="-0.02em">大模型推理双阶段硬件本质分野与优化心法</text>
  <text x="45" y="68" fill="#64748B" class="font-regular" font-size="12.5">Prefill 算力受限（Compute-Bound）与 Decode 访存受限（Memory-Bound）的微架构对比</text>

  
  <!-- Left Column: Prefill -->
  <g filter="url(#shadow-card)">
    <rect x="45" y="92" width="485" height="345" rx="14" fill="#FFFFFF" stroke="#E5DFD5" stroke-width="1.2"/>
  </g>
  <rect x="68" y="112" width="135" height="24" rx="12" fill="#FBF5F2" stroke="#CC6644" stroke-width="1"/>
  <text x="135" y="128.5" fill="#CC6644" class="font-mono" font-size="11" text-anchor="middle">STAGE 1 · PREFILL</text>
  <text x="215" y="129" fill="#0F172A" class="font-bold" font-size="15">首字处理 (Prompt Processing)</text>

  <g transform="translate(68, 150)">
    <rect x="0" y="0" width="439" height="60" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
    <text x="16" y="24" fill="#0F172A" class="font-bold" font-size="12.5">输入特征与并发模式</text>
    <text x="16" y="44" fill="#475569" class="font-regular" font-size="11.5">输入长文本 S 个 Tokens 一次性前向并行计算，无时序依赖。</text>

    <rect x="0" y="70" width="439" height="64" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
    <text x="16" y="94" fill="#0F172A" class="font-bold" font-size="12.5">核心算子与计算强度</text>
    <text x="16" y="114" fill="#475569" class="font-regular" font-size="11.5">超大矩阵乘 GEMM: (B·S, h) × (h, h)；数据在片上高度复用。</text>

    <rect x="0" y="144" width="439" height="74" rx="8" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1"/>
    <text x="16" y="168" fill="#1E40AF" class="font-bold" font-size="13">硬件物理瓶颈：算力受限 (Compute-Bound)</text>
    <text x="16" y="188" fill="#2563EB" class="font-regular" font-size="11.5">算术强度远高于 Roofline 拐点，可打满 Tensor Core 峰值算力。</text>
    <text x="16" y="206" fill="#1E40AF" class="font-medium" font-size="11">调优焦点：Chunked Prefill 动态配平、算子指令流水掩盖。</text>
  </g>

  <!-- Right Column: Decode -->
  <g filter="url(#shadow-card)">
    <rect x="570" y="92" width="485" height="345" rx="14" fill="#FFFFFF" stroke="#E5DFD5" stroke-width="1.2"/>
  </g>
  <rect x="593" y="112" width="135" height="24" rx="12" fill="#F8FAFC" stroke="#2563EB" stroke-width="1"/>
  <text x="660" y="128.5" fill="#2563EB" class="font-mono" font-size="11" text-anchor="middle">STAGE 2 · DECODE</text>
  <text x="740" y="129" fill="#0F172A" class="font-bold" font-size="15">逐字生成 (Autoregressive Generation)</text>

  <g transform="translate(593, 150)">
    <rect x="0" y="0" width="439" height="60" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
    <text x="16" y="24" fill="#0F172A" class="font-bold" font-size="12.5">输入特征与并发模式</text>
    <text x="16" y="44" fill="#475569" class="font-regular" font-size="11.5">每次自回归步仅输入 1 个 Token (B=1)，强烈的时序串行依赖。</text>

    <rect x="0" y="70" width="439" height="64" rx="8" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
    <text x="16" y="94" fill="#0F172A" class="font-bold" font-size="12.5">核心算子与计算强度</text>
    <text x="16" y="114" fill="#475569" class="font-regular" font-size="11.5">矩阵-向量乘 GEMV：每步都需要从 HBM 完整遍历模型权重与历史 KV Cache。</text>

    <rect x="0" y="144" width="439" height="74" rx="8" fill="#FEF2F2" stroke="#FECACA" stroke-width="1"/>
    <text x="16" y="168" fill="#991B1B" class="font-bold" font-size="13">硬件物理瓶颈：显存受限 (Memory-Bound)</text>
    <text x="16" y="188" fill="#DC2626" class="font-regular" font-size="11.5">算术强度不足 1 FLOP/Byte，计算单元空等，受限于 HBM 带宽。</text>
    <text x="16" y="206" fill="#991B1B" class="font-medium" font-size="11">调优：PagedAttention 减碎片、Continuous Batching 增批、FP8 量化。</text>
  </g>

</svg>